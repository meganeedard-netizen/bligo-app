<html lang="fr">

<style>
  body { font-family: 'Inter', sans-serif; }
  html, body { overscroll-behavior-y: contain; }
  body { min-height: 100dvh !important; }
  /* Sur un vrai iPhone (encoche/île dynamique + barre du bas), le contenu
     touche sinon la barre de statut et le menu chevauche la barre du bas. */
  body { padding-top: env(safe-area-inset-top); padding-bottom: calc(6rem + env(safe-area-inset-bottom)) !important; }
  /* Bande blanche sous l'heure et la batterie (23/10/2026) : le contenu et l'en-tête ne passent plus dessous en faisant défiler. */
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #fff; z-index: 40; }
  header.sticky { top: env(safe-area-inset-top); }
  .font-logo { font-family: 'Poppins', sans-serif; }
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px !important; }
    /* Texte d'exemple de l'avis plus petit (19/10/2026) ; le champ reste à
       16px, sinon l'iPhone zoome la page quand on le touche. */
    #history-list textarea::placeholder { font-size: 12px; }
  }
</style>

  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-5">
  <div id="empty-state" class="hidden text-center py-16">
    <a href="accueil.html" class="inline-block bg-mango-500 text-white text-base font-semibold rounded-2xl px-8 py-3.5 shadow-md active:scale-[0.98] transition">Réserver mon premier livre</a>
  </div>

  <!-- Ordinateur (19/10/2026) : chaque carte d'étape en pleine largeur, alignée
       sur les bords de l'historique (lui reste sur deux colonnes). -->
  <div>
  <div id="overdue-section" class="hidden mb-8">
    <h2 class="text-base font-bold text-red-600 mb-3">En retard</h2>
    <div id="overdue-list" class="flex flex-col gap-3"></div>
  </div>

  <div id="borrowed-section" class="hidden mb-8">
    <h2 class="text-base font-bold text-ink mb-3">Emprunté</h2>
    <div id="borrowed-list" class="flex flex-col gap-3"></div>
  </div>

  <div id="ready-section" class="hidden mb-8">
    <h2 class="text-base font-bold text-ink mb-3">Commande prête</h2>
    <div id="ready-list" class="flex flex-col gap-3"></div>
  </div>

  <div id="preparing-section" class="hidden mb-8">
    <h2 class="text-base font-bold text-ink mb-3">En préparation</h2>
    <div id="preparing-list" class="flex flex-col gap-3"></div>
  </div>

  <!-- Files d'attente juste avant l'historique (22/10/2026, demande de Mégane). -->
  <div id="holds-section" class="hidden mb-8">
    <h2 class="text-base font-bold text-ink mb-1">Mes files d'attente</h2>
    <p class="text-xs text-ink/50 mb-3">Dès que le livre revient, il est mis de côté pour toi et tu as 48 h pour venir le chercher.</p>
    <div id="holds-list" class="flex flex-col gap-3"></div>
  </div>

  <div id="history-section" class="hidden">
    <h2 class="text-base font-bold text-ink mb-3">Historique</h2>
    <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 items-start"></div>
  </div>

  <div id="expired-section" class="hidden mt-4">
    <button type="button" onclick="toggleExpiredList()" class="w-full flex items-center justify-between text-left bg-red-50 rounded-2xl px-4 py-3">
      <span class="text-[13px] font-bold text-red-600">Expirés, remis en rayon (<span id="expired-count">0</span>)</span>
      <svg id="expired-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500 shrink-0 transition-transform"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="expired-list" class="hidden flex-col gap-3 mt-3"></div>
  </div>
  </div>
</main>

<!-- Horaires d'ouverture : même pop-up que sur l'accueil (19/10/2026) -->
<div id="opening-hours-backdrop" onclick="closeOpeningHoursModal(event)" class="hidden fixed inset-0 z-50 bg-brand/50 backdrop-blur-sm items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 relative">

    <p class="text-base font-bold text-ink mb-4">Horaires d'ouverture</p>
    <div id="opening-hours-list" class="flex flex-col gap-1.5"></div>
  </div>
</div>

    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Profil</span>

<script type="module">
  import { supabase } from './js/supabaseClient.js?v=20261016d';
  import { applyCachedTheme } from './js/theme.js?v=20261016d';
  applyCachedTheme();
  import { updateReservationBadge } from './js/navBadge.js?v=20261016d';
  import { showSnackbar, showDialog, confirmDialog } from './js/ui.js?v=20261016d';

  let currentUser = null;
  let reservations = [];
  let loans = [];
  let communes = [];
  let myRatings = {};
  let myComments = {};

  function formatDate(iso) {
    return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function formatDateShort(iso) {
    return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
  }

  function communeNameFor(communeId) {
    return communes.find(c => c.id === communeId)?.name || '?';
  }

  // Adresse remise en forme quelle que soit la saisie de l'agent (19/10/2026) :
  // « RUE OWEL SOLVET 97190 SAINTE ANNE » → « rue Owel Solvet 97190 Sainte Anne ».
  // Mots de liaison et type de voie en minuscules, le reste avec une majuscule.
  const ADDRESS_SMALL_WORDS = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'à', 'au', 'aux', 'et', 'en', 'sur', 'sous',
    'rue', 'avenue', 'av', 'boulevard', 'bd', 'chemin', 'impasse', 'allée', 'place', 'route', 'lotissement', 'résidence',
    'quartier', 'cité', 'section', 'lieu-dit', 'bp', 'cs']);
  function formatAddressWord(word, index) {
    return word.split('-').map((part, j) => {
      const elided = part.match(/^([ld]['’])(.+)$/);
      if (elided) return elided[1] + elided[2].charAt(0).toUpperCase() + elided[2].slice(1);
      if ((index > 0 || j > 0) && ADDRESS_SMALL_WORDS.has(part)) return part;
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join('-');
  }
  function formatAddress(raw) {
    const clean = String(raw || '').trim().replace(/\s+/g, ' ').replace(/\s*,\s*/g, ', ');
    const match = clean.match(/^(.*?)(\d{5})\s*(.*)$/);
    const formatPart = (text, isTown) => text.toLowerCase().split(' ').filter(Boolean)
      .map((w, i) => isTown ? formatAddressWord(w, i) : formatAddressWord(w, i === 0 || /^\d/.test(w) ? 1 : i))
      .join(' ');
    if (!match) return formatPart(clean, false);
    return [formatPart(match[1], false), match[2], formatPart(match[3], true)].filter(Boolean).join(' ').replace(/\s+,/g, ',');
  }

  function communeAddressFor(communeId) {
    return formatAddress(communes.find(c => c.id === communeId)?.address);
  }

  const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Médiathèque, adresse et horaires, centrés sous les livres (19/10/2026).
  // Toucher l'adresse propose de lancer la navigation dans l'appli GPS choisie.
  // « Horaires » ouvre le pop-up des horaires jour par jour (19/10/2026).
  function communeFooterHtml(communeId, { nameClass = '', subClass = '' } = {}) {
    const address = communeAddressFor(communeId);
    const hours = communes.find(c => c.id === communeId)?.opening_hours;
    const hasHours = hours && typeof hours === 'object' && Object.values(hours).some(Boolean);
    return `
      <p class="text-xs ${nameClass}"><span class="font-bold">📍 Médiathèque de ${communeNameFor(communeId)}</span>${address ? `, <button type="button" onclick="openNavigation(${communeId})" class="inline font-semibold">${escapeHtml(address)}</button>` : ''}</p>
      ${hasHours ? `<button type="button" onclick="openOpeningHoursModal(${communeId})" class="block mx-auto text-[11px] font-semibold underline underline-offset-2 mt-0.5 ${subClass}">Horaires</button>` : ''}`;
  }

  window.openOpeningHoursModal = function (communeId) {
    const hours = communes.find(c => c.id === communeId)?.opening_hours || {};
    // getDay() : 0 = dimanche ; on décale pour que 0 = lundi.
    const todayIndex = (new Date().getDay() + 6) % 7;
    document.getElementById('opening-hours-list').innerHTML = WEEK_DAYS.map((day, i) => `
      <div class="flex items-center justify-between gap-3 px-3 py-2 rounded-lg ${i === todayIndex ? 'bg-mango-50' : ''}">
        <span class="text-sm capitalize ${i === todayIndex ? 'font-bold text-ink' : 'text-ink/70'}">${day}</span>
        <span class="text-sm ${i === todayIndex ? 'font-bold text-ink' : 'text-ink/60'}">${escapeHtml(hours[day] || 'Fermé')}</span>
      </div>`).join('');
    document.getElementById('opening-hours-backdrop').classList.remove('hidden');
    document.getElementById('opening-hours-backdrop').classList.add('flex');
  };

  window.closeOpeningHoursModal = function (event) {
    if (event && event.target.id !== 'opening-hours-backdrop') return;
    document.getElementById('opening-hours-backdrop').classList.add('hidden');
    document.getElementById('opening-hours-backdrop').classList.remove('flex');
  };

  // Plans n'existe que sur iPhone, iPad et Mac (l'iPad se présente comme un Mac).
  const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  window.openNavigation = async function (communeId) {
    const address = communeAddressFor(communeId);
    if (!address) return;
    const destination = encodeURIComponent(address);
    const apps = [
      ...(IS_APPLE ? [{ label: 'Plans', value: `https://maps.apple.com/?daddr=${destination}` }] : []),
      { label: 'Google Maps', value: `https://www.google.com/maps/dir/?api=1&destination=${destination}` },
      { label: 'Waze', value: `https://waze.com/ul?q=${destination}&navigate=yes` },
    ];
    const url = await showDialog({
      title: 'Veux-tu lancer la navigation ?',
      message: `Médiathèque de ${communeNameFor(communeId)}, ${address}`,
      buttons: [...apps.map(app => ({ ...app, primary: true })), { label: 'Annuler', value: null }],
    });
    if (!url) return;
    if (!window.open(url, '_blank')) window.location.href = url;
  };

  // Horaires enregistrés jour par jour ({ lundi: '9h-12h', … }) depuis Réglages.
  const WEEK_DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      // Sans compte (12/10/2026) : on ne renvoie plus vers l'inscription,
      // on l'explique sur place. Le compte n'est demandé qu'au moment de réserver.
      document.querySelector('main').innerHTML = `
        <div class="text-center py-12 px-4">
          <p class="text-lg font-bold text-ink">Tes réservations</p>
          <p class="text-sm text-ink/60 mt-2 max-w-xs mx-auto">Crée ton compte pour réserver des livres et suivre tes emprunts. Le catalogue reste consultable librement.</p>
          <a href="index.html?gate=reserve" class="inline-block mt-6 bg-mango-500 text-white text-base font-semibold rounded-2xl px-8 py-3.5 shadow-md">Créer mon compte</a>
          <p class="mt-4 text-sm text-ink/70">J'ai déjà un compte - <a href="index.html?login=1" class="font-semibold text-mango-700">Se connecter</a></p>
          <a href="accueil.html" class="block mt-4 text-sm font-semibold text-mango-700">Retour au catalogue</a>
        </div>`;
      return;
    }
    currentUser = session.user;
    updateReservationBadge(currentUser.id);

    const { data: communesData } = await supabase.from('communes').select('*');
    communes = communesData || [];

    await Promise.all([loadReservations(), loadLoans(), loadMyRatings(), loadHolds()]);
    renderAll();
    watchMyChanges();

    if (window.location.hash === '#history-section') {
      document.getElementById('history-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // Mise à jour instantanée (22/10/2026) : quand l'agent prépare, remet un
  // livre ou enregistre un retour, la page se rafraîchit seule (temps réel
  // Supabase, sql/add_realtime_reservations.sql), et aussi quand on revient
  // sur l'appli (téléphone sorti de veille, autre onglet).
  let refreshTimer = null;
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async () => {
      await Promise.all([loadReservations(), loadLoans(), loadHolds()]);
      renderAll();
      updateReservationBadge(currentUser.id);
    }, 400);
  }

  function watchMyChanges() {
    ['reservations', 'loans', 'holds']
      .reduce((channel, table) => channel.on('postgres_changes',
        { event: '*', schema: 'public', table, filter: `user_id=eq.${currentUser.id}` }, scheduleRefresh),
        supabase.channel('mes-reservations'))
      .subscribe();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') scheduleRefresh();
    });
  }

  // Avis déjà donnés par l'usager sur ses livres empruntés et rendus, pour les
  // afficher en couleur dans l'historique (comme sur Gaspiz).
  async function loadMyRatings() {
    const { data, error } = await supabase
      .from('book_reviews')
      .select('book_id, rating, comment')
      .eq('user_id', currentUser.id);
    if (error) { console.error(error); return; }
    myRatings = Object.fromEntries((data || []).map(r => [r.book_id, r.rating]));
    myComments = Object.fromEntries((data || []).map(r => [r.book_id, r.comment || '']));
  }

  async function loadReservations() {
    const { data, error } = await supabase
      .from('reservations')
      .select('id, status, created_at, ready_at, return_due_at, books ( id, title, author, cover_initial, cover_url, commune_id )')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    reservations = data;
  }

  // Emprunts pris directement au comptoir, sans réservation Click & Collect
  // préalable (scan de la carte usager par l'agent) - reservation_id null
  // filtre les emprunts déjà couverts par loadReservations() ci-dessus, pour
  // ne pas les afficher en double.
  async function loadLoans() {
    let { data, error } = await supabase
      .from('loans')
      .select('id, borrowed_at, due_at, returned_at, borrowed_at_commune_id, renewal_count, book_copies ( books ( id, title, author, cover_initial, cover_url ) )')
      .eq('user_id', currentUser.id)
      .is('reservation_id', null)
      .order('borrowed_at', { ascending: false });
    if (error) {
      // Colonne renewal_count absente tant que add_renewal_holds_membership.sql n'est pas passée.
      ({ data, error } = await supabase
        .from('loans')
        .select('id, borrowed_at, due_at, returned_at, borrowed_at_commune_id, book_copies ( books ( id, title, author, cover_initial, cover_url ) )')
        .eq('user_id', currentUser.id)
        .is('reservation_id', null)
        .order('borrowed_at', { ascending: false }));
    }
    if (error) { console.error(error); return; }
    loans = data;
    // Prêts issus d'une réservation (16/10/2026) : c'est le prêt qui dit si le
    // livre est rendu et jusqu'à quand il est emprunté (prolongation comprise).
    // Sans ça, un livre réservé puis rendu restait « En retard » pour toujours
    // et n'arrivait jamais dans l'historique.
    const { data: fromResa } = await supabase.from('loans').select('reservation_id, renewal_count, due_at, returned_at')
      .eq('user_id', currentUser.id).not('reservation_id', 'is', null).order('borrowed_at', { ascending: false });
    loanByReservation = {};
    (fromResa || []).forEach(l => { if (!loanByReservation[l.reservation_id]) loanByReservation[l.reservation_id] = l; });
    renewalsByReservation = Object.fromEntries(Object.values(loanByReservation).filter(l => !l.returned_at).map(l => [l.reservation_id, l.renewal_count || 0]));
  }

  // Prolongation (09/10/2026) : +7 jours, une seule fois, refusée si
  // quelqu'un attend le livre ou si le prêt est déjà en retard.
  let renewalsByReservation = {};
  let loanByReservation = {};
  let myHolds = [];

  function renewButtonHtml(it) {
    if (it.renewalCount >= 1) return `<p class="text-[11px] text-white/60 mt-1.5">Déjà prolongé une fois</p>`;
    return `<button onclick="renewMyLoan('${it.id}')" class="mt-2 text-[11px] font-semibold bg-white/15 border border-white/25 text-white rounded-full px-3 py-1.5 active:scale-[0.97] transition">Prolonger d'1 semaine</button>`;
  }

  window.renewMyLoan = async function (itemId) {
    const isLoan = String(itemId).startsWith('loan-');
    const params = isLoan ? { p_loan_id: Number(String(itemId).slice(5)) } : { p_reservation_id: Number(itemId) };
    const { data, error } = await supabase.rpc('renew_loan', params);
    if (error || data?.ok === false) showDialog({ message: error ? error.message : data.message });
    else showSnackbar(data?.message || 'Prêt prolongé d\'une semaine.');
    await Promise.all([loadReservations(), loadLoans()]);
    renderAll();
  };

  async function loadHolds() {
    const { data, error } = await supabase.rpc('my_holds');
    myHolds = error ? [] : (data || []);
  }

  window.leaveMyHold = async function (holdId) {
    const ok = await confirmDialog({ title: 'Quitter la file d\'attente ?', message: 'Tu ne seras plus prévenu au retour de ce livre.', confirmLabel: 'Je quitte la file', cancelLabel: 'Je reste dans la file' });
    if (!ok) return;
    await supabase.rpc('leave_hold', { p_hold_id: holdId });
    await loadHolds();
    renderAll();
  };

  function renderHoldsList() {
    const section = document.getElementById('holds-section');
    section.classList.toggle('hidden', !myHolds.length);
    document.getElementById('holds-list').innerHTML = myHolds.map(h => `
      <div class="bg-white rounded-2xl p-3.5 shadow-sm flex items-center gap-3">
        ${h.cover_url
          ? `<img src="${h.cover_url}" alt="" class="w-10 h-14 object-cover rounded shrink-0 bg-mango-50">`
          : `<div class="w-10 h-14 rounded bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${h.cover_initial || (h.title || '?')[0]}</div>`}
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-ink truncate">${h.title}</p>
          <p class="text-xs text-ink/55 truncate">${h.author || ''}</p>
          <p class="text-[11px] font-semibold text-mango-700 mt-1">⏳ Tu es n° ${h.queue_position} dans la file</p>
        </div>
        <button onclick="leaveMyHold(${h.hold_id})" class="shrink-0 text-[11px] text-ink/40 underline">Quitter</button>
      </div>`).join('');
  }

  function normalize(list) {
    return (list || []).map(r => {
      const book = r.books;
      const loan = r.status === 'recupere' ? loanByReservation[r.id] : null;
      return {
        id: r.id,
        title: book?.title || 'Livre supprimé',
        author: book?.author || '',
        coverInitial: book?.cover_initial || book?.title?.[0] || '?',
        coverUrl: book?.cover_url || null,
        communeId: book?.commune_id || null,
        bookId: book?.id || null,
        status: loan?.returned_at ? 'loan_returned' : r.status,
        createdAt: r.created_at,
        orderedAt: r.created_at,
        readyAt: r.ready_at || null,
        returnDueAt: loan?.due_at || r.return_due_at || null,
        renewalCount: renewalsByReservation[r.id] || 0,
        myRating: book?.id ? (myRatings[book.id] || null) : null,
        myComment: book?.id ? (myComments[book.id] || '') : '',
      };
    });
  }

  // Même forme que normalize(), pour les emprunts comptoir sans réservation.
  // statut "loan_returned" (propre à cette page) plutôt que réutiliser
  // "expiree" - ce statut sert déjà pour une réservation non récupérée à
  // temps, pas pour un livre normalement rendu après lecture.
  function normalizeLoans(list) {
    return (list || []).map(l => {
      const book = l.book_copies?.books;
      return {
        id: `loan-${l.id}`,
        title: book?.title || 'Livre supprimé',
        author: book?.author || '',
        coverInitial: book?.cover_initial || book?.title?.[0] || '?',
        coverUrl: book?.cover_url || null,
        communeId: l.borrowed_at_commune_id || null,
        bookId: book?.id || null,
        status: l.returned_at ? 'loan_returned' : 'recupere',
        createdAt: l.borrowed_at,
        readyAt: null,
        returnDueAt: l.due_at || null,
        renewalCount: l.renewal_count || 0,
        myRating: book?.id ? (myRatings[book.id] || null) : null,
        myComment: book?.id ? (myComments[book.id] || '') : '',
      };
    });
  }

  function bookRowHtml(item, opts = {}) {
    const light = !!opts.light;
    const coverHtml = item.coverUrl
      ? `<img src="${item.coverUrl}" alt="" class="w-11 aspect-[2/3] object-cover rounded-md shadow-sm shrink-0">`
      : `<div class="w-11 aspect-[2/3] rounded-md bg-gradient-to-br ${light ? 'from-white/25 to-white/10' : 'from-mango-500 to-hibiscus-600'} flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${item.coverInitial}</div>`;
    const metaHtml = opts.hideMeta ? '' : `<p class="text-[10.5px] ${light ? 'text-white/60' : 'text-ink/40'} mt-0.5">${item.communeId ? `Médiathèque de ${communeNameFor(item.communeId)}` : ''}</p>`;
    return `
      <div class="flex items-center gap-3">
        ${coverHtml}
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold ${light ? 'text-white' : 'text-ink'}">${item.title}</p>
          <p class="text-[11px] ${light ? 'text-white/75' : 'text-ink/50'}">${item.author}</p>
          ${metaHtml}
        </div>
      </div>`;
  }

  // Un groupe = les livres d'une même médiathèque, pour afficher une
  // languette par destination plutôt qu'une liste mélangée - utilisé pour
  // "Prêt à récupérer" et "En préparation".
  function groupByCommune(items) {
    const groups = new Map();
    for (const item of items) {
      const key = item.communeId;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    }
    return [...groups.values()].sort((a, b) => {
      const aLatest = Math.max(...a.map(it => new Date(it.createdAt).getTime()));
      const bLatest = Math.max(...b.map(it => new Date(it.createdAt).getTime()));
      return bLatest - aLatest;
    });
  }

  // Livres récupérés, encore dans les 3 semaines de prêt.
  function borrowedGroupHtml(items) {
    const communeId = items[0].communeId;
    const nearestDue = items.reduce((min, it) => new Date(it.returnDueAt) < new Date(min) ? it.returnDueAt : min, items[0].returnDueAt);
    const rowsHtml = items.map((it, i) => `<div class="${i > 0 ? 'pt-2.5' : ''}">${bookRowHtml(it, { light: true, hideMeta: true })}${renewButtonHtml(it)}</div>`).join('');
    return `
      <div class="rounded-2xl p-3.5 text-white shadow-md bg-gradient-to-br from-brand to-brand/80 relative overflow-hidden">
        <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-white/10"></div>
        <div class="relative flex justify-end mb-2.5">
          <span class="w-fit bg-white text-ink text-[11px] font-bold px-2.5 py-1.5 rounded-full shadow-sm text-right">📅 Pense à ramener le livre le ${formatDateShort(nearestDue)}</span>
        </div>
        <div class="relative flex flex-col gap-2.5 divide-y divide-white/15">
          ${rowsHtml}
        </div>
        <div class="relative mt-2.5 pt-2.5 border-t border-white/15 text-center">
          ${communeFooterHtml(communeId, { subClass: 'text-white/80' })}
        </div>
      </div>`;
  }

  // Livres récupérés, dont la date de retour est dépassée.
  function overdueGroupHtml(items) {
    const communeId = items[0].communeId;
    const oldestDue = items.reduce((min, it) => new Date(it.returnDueAt) < new Date(min) ? it.returnDueAt : min, items[0].returnDueAt);
    const daysLate = Math.max(1, Math.ceil((new Date() - new Date(oldestDue)) / 86400000));
    const rowsHtml = items.map((it, i) => `<div class="${i > 0 ? 'pt-2.5' : ''}">${bookRowHtml(it, { hideMeta: true })}</div>`).join('');
    return `
      <div class="bg-red-50 rounded-2xl p-3.5 shadow-sm">
        <div class="flex justify-end mb-2.5">
          <span class="w-fit bg-red-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-full shadow-sm text-right">⚠️ En retard depuis ${daysLate} jour${daysLate > 1 ? 's' : ''}, à rapporter à la Médiathèque Municipale</span>
        </div>
        <div class="flex flex-col gap-2.5 divide-y divide-red-100">
          ${rowsHtml}
        </div>
        <div class="mt-2.5 pt-2.5 border-t border-red-100 text-center">
          ${communeFooterHtml(communeId, { nameClass: 'text-red-700', subClass: 'text-red-600/80' })}
        </div>
      </div>`;
  }

  function readyGroupHtml(group) {
    const communeId = group[0].communeId;
    const earliestReady = group.reduce((min, it) => new Date(it.readyAt) < new Date(min) ? it.readyAt : min, group[0].readyAt);
    const deadline = new Date(new Date(earliestReady).getTime() + 48 * 3600 * 1000);
    const hoursLeft = Math.max(0, Math.round((deadline - new Date()) / 3600000));
    const rowsHtml = group.map((it, i) => `<div class="${i > 0 ? 'pt-2.5' : ''}">${bookRowHtml(it, { light: true, hideMeta: true })}</div>`).join('');
    // Carte toujours orange hibiscus, même sous 24 h (19/10/2026, demande de Mégane).
    const pillText = hoursLeft <= 0 ? '⏰ Délai dépassé : contacte la Médiathèque Municipale' : `⏰ Il te reste ${hoursLeft}h pour récupérer ta commande`;

    return `
      <div class="rounded-2xl p-3.5 text-white shadow-md bg-gradient-to-br from-mango-600 to-hibiscus-700 relative overflow-hidden">
        <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-white/10"></div>
        <div class="relative flex justify-end mb-2.5">
          <span class="w-fit bg-white text-mango-700 text-[11px] font-bold px-2.5 py-1.5 rounded-full shadow-sm text-right">${pillText}</span>
        </div>
        <div class="relative flex flex-col gap-2.5 divide-y divide-white/15">
          ${rowsHtml}
        </div>
        <div class="relative mt-2.5 pt-2.5 border-t border-white/15 text-center">
          ${communeFooterHtml(communeId, { subClass: 'text-white/80' })}
        </div>
      </div>`;
  }

  // 30 minutes pour modifier sa commande, à partir de sa validation
  // (16/10/2026) : on peut encore retirer des livres, ensuite c'est bloqué
  // (règle aussi imposée côté base de données).
  const EDIT_WINDOW_MS = 30 * 60 * 1000;
  const editMinutesLeft = it => Math.ceil((new Date(it.orderedAt).getTime() + EDIT_WINDOW_MS - Date.now()) / 60000);

  function preparingGroupHtml(group) {
    const editable = group.some(it => editMinutesLeft(it) > 0);
    const minutesLeft = Math.max(...group.map(editMinutesLeft));
    const rowsHtml = group.map((it, i) => `
      <div class="${i > 0 ? 'pt-2.5' : ''} flex items-center gap-2">
        <div class="flex-1 min-w-0">${bookRowHtml(it, { hideMeta: true })}</div>
        ${editMinutesLeft(it) > 0 ? `<button type="button" onclick="cancelPreparingReservation(${it.id})" class="shrink-0 text-[11px] font-semibold text-red-500/75 hover:text-red-600 border border-red-100 bg-white rounded-full px-2.5 py-1.5">Retirer</button>` : ''}
      </div>`).join('');
    const message = editable
      ? `<p class="text-xs text-amber-900/80 leading-relaxed">Tu peux encore modifier ta commande. On te prévient dès qu'elle est prête.</p>
         <p class="text-[11px] font-bold text-amber-700 mt-1.5">⏱ Encore ${minutesLeft} min pour la modifier</p>`
      : `<p class="text-xs text-amber-900/80 leading-relaxed">Ta commande est en préparation. On te prévient dès qu'elle est prête.</p>`;
    return `
      <div class="bg-amber-50 rounded-2xl p-3.5 shadow-sm">
        <div class="mb-3">${message}</div>
        <div class="flex flex-col gap-2.5 divide-y divide-amber-100">
          ${rowsHtml}
        </div>
      </div>`;
  }

  // Retirer un livre de la commande : pop-up centré puis snackbar (16/10/2026).
  window.cancelPreparingReservation = async function (reservationId) {
    const ok = await confirmDialog({
      title: 'Retirer ce livre ?',
      message: 'Il sera retiré de ta commande.',
      confirmLabel: 'Retirer le livre',
      cancelLabel: 'Garder le livre',
    });
    if (!ok) return;
    const { data, error } = await supabase.from('reservations').delete().eq('id', reservationId).select();
    if (error) { showDialog({ message: 'Erreur : ' + error.message }); return; }
    if (!data || !data.length) {
      showDialog({ title: 'Trop tard', message: 'Les 30 minutes sont passées : ta commande est déjà en préparation à la médiathèque, il n\'est plus possible de la modifier.' });
    } else {
      showSnackbar('Livre retiré de ta commande');
    }
    await loadReservations();
    renderAll();
    updateReservationBadge(currentUser.id);
  };

  function historyItemHtml(item) {
    const isExpired = item.status === 'expiree';
    // Ici, uniquement "Déjà lu" (blanc) ou "Expirée" (rouge) - un livre du
    // catalogue encore dans ses 3 semaines de prêt est affiché dans sa
    // propre section "Emprunté", pas ici.
    const coverHtml = item.coverUrl
      ? `<img src="${item.coverUrl}" alt="" class="w-11 aspect-[2/3] object-cover rounded-md shadow-sm shrink-0">`
      : `<div class="w-11 aspect-[2/3] rounded-md bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${item.coverInitial}</div>`;

    const tagHtml = isExpired
      ? `<span class="shrink-0 text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap bg-red-50 text-red-600">Expirée, remise en rayon</span>`
      : `<span class="shrink-0 text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap bg-brand/5 text-ink/45">Déjà lu</span>`;

    const ratingHtml = ((item.status === 'recupere' || item.status === 'loan_returned') && item.bookId)
      ? `
        <div class="mt-1.5">
          <p class="text-[10px] font-semibold text-ink/40 mb-1">${item.myRating ? 'Ta note' : 'Note ce livre'}</p>
          <div class="flex items-center gap-2">
          <div class="flex items-center gap-0.5">
            ${Array.from({ length: 5 }, (_, i) => `
              <button type="button" onclick="rateBookFromHistory(${item.bookId}, ${i + 1})" class="w-5 h-5" aria-label="${i + 1} étoile${i > 0 ? 's' : ''}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="${i < (item.myRating || 0) ? '#F07F14' : 'none'}" stroke="${i < (item.myRating || 0) ? '#F07F14' : '#D1D5DB'}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.2-5.4 3.2 1.3-6-4.6-4.1 6.1-.6Z"/></svg>
              </button>`).join('')}
          </div>
          <span class="ml-auto">${tagHtml}</span>
          </div>
          ${item.myRating ? `
            <div class="mt-2">
              <textarea id="history-comment-${item.bookId}" maxlength="300" placeholder="Ton avis en quelques mots…" class="w-full bg-[#EEEDF2] rounded-xl px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-mango-300 resize-none" rows="2">${escapeHtml(item.myComment)}</textarea>
              <button type="button" onclick="saveHistoryComment(${item.bookId})" class="mt-1 text-[11px] font-semibold text-mango-700">Enregistrer le commentaire</button>
              <span id="history-comment-msg-${item.bookId}" class="text-[11px] text-ink/40 ml-2"></span>
            </div>` : ''}
        </div>`
      : `<div class="mt-1.5">${tagHtml}</div>`;

    // Titre sur une seule ligne (23/10/2026) : l'étiquette « Déjà lu » est à
    // droite des étoiles, le titre prend toute la largeur.
    return `
      <div class="bg-white shadow-sm rounded-2xl p-3.5">
        <div class="flex items-center gap-3">
          ${coverHtml}
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-ink truncate">${item.title}</p>
            <p class="text-[11px] text-ink/50">${item.author}</p>
            <p class="text-[10.5px] text-ink/40 mt-0.5">${formatDate(item.createdAt)}${item.communeId ? ` · Médiathèque de ${communeNameFor(item.communeId)}` : ''}</p>
            ${ratingHtml}
          </div>
        </div>
      </div>`;
  }

  function renderReadyList(items) {
    const section = document.getElementById('ready-section');
    const el = document.getElementById('ready-list');
    section.classList.toggle('hidden', !items.length);
    el.innerHTML = items.length ? groupByCommune(items).map(readyGroupHtml).join('') : '';
  }

  function renderPreparingList(items) {
    const section = document.getElementById('preparing-section');
    const el = document.getElementById('preparing-list');
    section.classList.toggle('hidden', !items.length);
    el.innerHTML = items.length ? groupByCommune(items).map(preparingGroupHtml).join('') : '';
  }

  function renderHistoryList(items) {
    const section = document.getElementById('history-section');
    const el = document.getElementById('history-list');
    section.classList.toggle('hidden', !items.length);
    el.innerHTML = items.length ? items.map(historyItemHtml).join('') : '';
  }

  function renderExpiredList(items) {
    document.getElementById('expired-section').classList.toggle('hidden', !items.length);
    document.getElementById('expired-count').textContent = items.length;
    document.getElementById('expired-list').innerHTML = items.length ? items.map(historyItemHtml).join('') : '';
  }

  window.toggleExpiredList = function () {
    document.getElementById('expired-list').classList.toggle('hidden');
    document.getElementById('expired-list').classList.toggle('flex');
    document.getElementById('expired-chevron').classList.toggle('rotate-180');
  };

  function renderBorrowedList(items) {
    const section = document.getElementById('borrowed-section');
    const el = document.getElementById('borrowed-list');
    section.classList.toggle('hidden', !items.length);
    // Regroupé par médiathèque (comme "Prêt à récupérer") pour n'afficher la
    // localisation qu'une fois par carte plutôt que sous chaque livre.
    el.innerHTML = items.length ? groupByCommune(items).map(borrowedGroupHtml).join('') : '';
  }

  function renderOverdueList(items) {
    const section = document.getElementById('overdue-section');
    const el = document.getElementById('overdue-list');
    section.classList.toggle('hidden', !items.length);
    el.innerHTML = items.length ? groupByCommune(items).map(overdueGroupHtml).join('') : '';
  }

  // Avis refusé par la base : auteur bloqué par la médiathèque (42501) ou mots
  // interdits (message du filtre, déjà rédigé pour l'usager).
  function reviewErrorMessage(error) {
    if (error.code === '42501') return 'Tu ne peux plus publier d\'avis. Rapproche-toi de ta médiathèque.';
    return error.message;
  }

  window.rateBookFromHistory = async function (bookId, rating) {
    if (myRatings[bookId] && myRatings[bookId] !== rating) {
      const ok = await confirmDialog({ title: 'Changer ta note ?', message: 'Tu as déjà noté ce livre.', confirmLabel: 'Changer ma note', cancelLabel: 'Garder ma note' });
      if (!ok) return;
    }
    const { error } = await supabase
      .from('book_reviews')
      .upsert({ book_id: bookId, user_id: currentUser.id, rating }, { onConflict: 'book_id,user_id' });
    if (error) { showDialog({ message: reviewErrorMessage(error) }); return; }
    myRatings[bookId] = rating;
    renderAll();
  };

  window.saveHistoryComment = async function (bookId) {
    const textarea = document.getElementById(`history-comment-${bookId}`);
    const msg = document.getElementById(`history-comment-msg-${bookId}`);
    const { error } = await supabase
      .from('book_reviews')
      .upsert({ book_id: bookId, user_id: currentUser.id, rating: myRatings[bookId], comment: textarea.value.trim() || null }, { onConflict: 'book_id,user_id' });
    if (error) { msg.textContent = reviewErrorMessage(error); msg.className = 'text-[11px] text-red-600 ml-2'; return; }
    myComments[bookId] = textarea.value.trim();
    msg.textContent = 'Enregistré ✓';
    msg.className = 'text-[11px] text-ink/40 ml-2';
  };

  function renderAll() {
    const combined = [...normalize(reservations), ...normalizeLoans(loans)];
    const ready = combined.filter(x => x.status === 'pret');
    const preparing = combined.filter(x => x.status === 'preparation');
    const isOverdue = x => x.status === 'recupere' && x.returnDueAt && new Date(x.returnDueAt) <= new Date();
    const isStillOnLoan = x => x.status === 'recupere' && x.returnDueAt && new Date(x.returnDueAt) > new Date();
    const overdue = combined.filter(isOverdue);
    const borrowed = combined.filter(isStillOnLoan);
    const history = combined
      .filter(x => x.status === 'loan_returned' || (x.status === 'recupere' && !isStillOnLoan(x) && !isOverdue(x)))
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const expired = combined
      .filter(x => x.status === 'expiree')
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    document.getElementById('empty-state').classList.toggle('hidden', !!combined.length || !!myHolds.length);
    // Chaque rubrique est affichée séparément : une erreur dans l'une ne doit
    // plus faire disparaître toutes les suivantes (16/10/2026).
    const safely = fn => { try { fn(); } catch (e) { console.error(e); } };
    safely(renderHoldsList);
    safely(() => renderOverdueList(overdue));
    safely(() => renderBorrowedList(borrowed));
    safely(() => renderReadyList(ready));
    safely(() => renderPreparingList(preparing));
    safely(() => renderHistoryList(history));
    safely(() => renderExpiredList(expired));
  }

  // Le décompte des 30 minutes se met à jour tout seul.
  setInterval(() => { if (currentUser) renderAll(); }, 30000);

  init();
</script>
</body>
</html>
