<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BliGO · Liste d'envie</title>
<link rel="stylesheet" href="css/bligo.css?v=20261023">
<link rel="preload" href="css/fonts/inter-latin-1ab1ad.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=20261023">
<style>
  body { font-family: 'Inter', sans-serif; }
  html, body { overscroll-behavior-y: contain; }
  body { min-height: 100dvh !important; }
  /* Sur un vrai iPhone (encoche/île dynamique + barre du bas), le contenu
     touche sinon la barre de statut et le menu chevauche la barre du bas. */
  body { padding-top: env(safe-area-inset-top); padding-bottom: calc(6rem + env(safe-area-inset-bottom)) !important; }
  /* Bande blanche sous l'heure et la batterie (23/10/2026) : le contenu et l'en-tête ne passent plus dessous en faisant défiler. */
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #fff; z-index: 40; }
  header.sticky { top: env(safe-area-inset-top); }
  .font-logo { font-family: 'Poppins', sans-serif; }
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px; }
  }
  .toggle { width: 52px; height: 30px; border-radius: 999px; background: #E3E2E8; position: relative; transition: background .2s; }
  .toggle span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .toggle[aria-checked="true"] { background: var(--color-mango-500, #FF9B2E); }
  .toggle[aria-checked="true"] span { transform: translateX(22px); }
</style>
<!-- Contenu masqué tant que la page n'a pas ses vraies données (23/10/2026) :
     plus de flash de « 0 point » ou de page vide. Sécurité : affiché au bout de 2,5 s quoi qu'il arrive. -->
<style>html.page-loading main { visibility: hidden; }</style>
<script>document.documentElement.classList.add('page-loading'); setTimeout(function () { document.documentElement.classList.remove('page-loading'); }, 2500);</script>
</head>
<body class="bg-white text-ink min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-white shadow-sm">
  <div class="max-w-4xl mx-auto px-5 py-3">
    <h1 class="text-lg font-semibold text-ink/70 text-center">Ma liste d'envie</h1>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-5">
  <!-- Même carte Notifications que dans Mes informations (12/10/2026) -->
  <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 flex items-center justify-between gap-4">
    <div>
      <p class="text-base font-bold text-ink">Notifications</p>
      <p class="text-xs text-ink/55 mt-0.5">Reçois une alerte dès qu'un livre de ta liste d'envie revient en rayon.</p>
    </div>
    <button id="notif-toggle" type="button" role="switch" aria-checked="false" class="toggle shrink-0"><span></span></button>
  </div>

  <div id="wishlist-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 items-start"></div>
</main>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.06)]" style="transform: translateZ(0); padding-bottom: env(safe-area-inset-bottom);">
  <div class="max-w-4xl mx-auto w-full flex items-stretch pt-2 pb-1.5 px-1">
  <a href="accueil.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5l8-7 8 7"/><path d="M6 10.3V19a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-8.7"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Accueil</span>
  </a>
  <a href="reservations.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">
    <span class="relative">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 1 1 12 0c0 3.8 1.3 5.2 1.3 5.2H4.7S6 13.3 6 9.5Z"/><path d="M10 17.7a2 2 0 0 0 4 0"/></svg>
      <span id="nav-resa-badge" class="hidden absolute -top-1 -right-1.5 min-w-[15px] h-[15px] px-1 rounded-full bg-mango-600 text-white text-[9px] font-bold flex items-center justify-center leading-none">0</span>
    </span>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight" id="nav-resa-label">Réservation</span>
  </a>
  <a href="liste-envie.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-mango-700">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Favoris</span>
  </a>
  <a href="agenda.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Agenda</span>
  </a>
  <a href="profil.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.6" cy="11" r="2"/><path d="M5.6 16c.4-1.7 1.7-2.6 3-2.6s2.6.9 3 2.6"/><path d="M14 9.3h5M14 12.3h5M14 15.3h3.2"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Profil</span>
  </a>
  </div>
</nav>

<script type="module">
  import { supabase } from './js/supabaseClient.js?v=20261016d';
  import { applyCachedTheme } from './js/theme.js?v=20261016d';
  applyCachedTheme();
  import { updateReservationBadge } from './js/navBadge.js?v=20261016d';

  let currentUser = null;
  let wishlistRows = [];
  let notificationsEnabled = false;

  function heartIcon(filled) {
    return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>`;
  }

  function renderNotifToggle() {
    document.getElementById('notif-toggle').setAttribute('aria-checked', String(notificationsEnabled));
  }

  document.getElementById('notif-toggle').addEventListener('click', async () => {
    notificationsEnabled = !notificationsEnabled;
    renderNotifToggle();
    const { error } = await supabase.from('profiles').update({ notifications_enabled: notificationsEnabled }).eq('id', currentUser.id);
    if (error) {
      notificationsEnabled = !notificationsEnabled;
      renderNotifToggle();
      alert('Erreur : ' + error.message);
    }
  });

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      // Sans compte (12/10/2026) : on ne renvoie plus vers l'inscription,
      // on l'explique sur place. Le compte n'est demandé qu'au moment de réserver.
      document.querySelector('main').innerHTML = `
        <div class="text-center py-12 px-4">
          <p class="text-lg font-bold text-ink">Ta liste d'envie</p>
          <p class="text-sm text-ink/60 mt-2 max-w-xs mx-auto">Crée ton compte pour garder de côté les livres qui te font envie et être prévenu dès qu'ils sont disponibles.</p>
          <a href="index.html?gate=reserve" class="inline-block mt-6 bg-mango-500 text-white text-base font-semibold rounded-2xl px-8 py-3.5 shadow-md">Créer mon compte</a>
          <p class="mt-4 text-sm text-ink/70">J'ai déjà un compte - <a href="index.html?login=1" class="font-semibold text-mango-700">Se connecter</a></p>
        </div>`;
      return;
    }
    currentUser = session.user;
    updateReservationBadge(currentUser.id);

    const { data: profile } = await supabase.from('profiles').select('role, notifications_enabled').eq('id', currentUser.id).single();
    notificationsEnabled = !!profile?.notifications_enabled;
    renderNotifToggle();

    await loadWishlist();
  }

  async function loadWishlist() {
    const { data, error } = await supabase
      .from('wishlist')
      .select('book_id, books ( id, title, author, cover_initial, cover_url, available, category )')
      .eq('user_id', currentUser.id);
    if (error) {
      console.error(error);
      return;
    }
    wishlistRows = data;
    renderWishlist();
  }

  async function removeFromWishlist(bookId) {
    const { error } = await supabase.from('wishlist').delete().eq('user_id', currentUser.id).eq('book_id', bookId);
    if (error) {
      alert('Erreur liste d\'envie : ' + error.message);
      return;
    }
    await loadWishlist();
  }

  function renderWishlist() {
    const list = document.getElementById('wishlist-list');
    if (wishlistRows.length === 0) {
      list.innerHTML = `
        <div class="md:col-span-2 text-center py-10 px-4 max-w-md mx-auto">
          <p class="text-sm text-ink/55 leading-relaxed">Ta liste d'envie est vide. Sur la fiche d'un livre, appuie sur le cœur pour l'ajouter ici. S'il est emprunté, tu seras prévenu dès son retour.</p>
          <a href="accueil.html" class="inline-block mt-6 bg-mango-500 text-white text-base font-semibold rounded-2xl px-8 py-3.5 shadow-md active:scale-[0.98] transition">Voir le catalogue</a>
        </div>`;
      return;
    }
    list.innerHTML = wishlistRows.map(w => {
      const b = w.books;
      if (!b) return '';
      const cov = b.cover_url
        ? `<img src="${b.cover_url}" alt="" class="w-11 aspect-[2/3] object-cover rounded-md shadow-sm shrink-0">`
        : `<div class="w-11 aspect-[2/3] rounded-md bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${b.cover_initial || b.title[0]}</div>`;
      return `
        <div data-book-id="${b.id}" class="wishlist-card cursor-pointer bg-white shadow-sm rounded-2xl p-3.5 flex items-center gap-3 active:scale-[0.99] transition">
          ${cov}
          <div class="flex-1 min-w-0">
            ${b.category ? `<p class="text-[9.5px] font-bold uppercase tracking-wide text-mango-600 leading-tight mb-0.5">${({ BD: 'BD & Mangas', Thriller: 'Policier & Thriller', 'Fantasy': 'Science-Fiction & Fantasy', 'Poésie & théâtre': 'Poésie & Théâtre', 'Sciences & nature': 'Sciences & Nature', 'Histoire': 'Histoire & Patrimoine', 'Culture': 'Arts & Culture', 'Sports & loisirs': 'Sports & Loisirs', 'Bien-être': 'Santé & Bien-être', 'Maison': 'Maison & Jardin' })[b.category] || b.category}</p>` : ''}
            <p class="text-sm font-bold text-ink">${b.title}</p>
            <p class="text-[11px] text-ink/50">${b.author}</p>
            <span class="mt-1 inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${b.available ? 'bg-mango-50 text-mango-700' : 'bg-brand/5 text-ink/40'}">
              ${b.available ? '● Disponible' : '🔔 Alerte active'}
            </span>
          </div>
          <button data-book-id="${b.id}" class="wishlist-remove-btn w-7 h-7 text-hibiscus-600 shrink-0">${heartIcon(true)}</button>
        </div>`;
    }).join('');
    list.querySelectorAll('.wishlist-remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromWishlist(Number(btn.dataset.bookId)); });
    });
    // Toucher un livre ouvre sa fiche (résumé, avis, Commander), comme dans le
    // catalogue ; on revient ici en la fermant (16/10/2026).
    list.querySelectorAll('.wishlist-card').forEach(card => {
      card.addEventListener('click', () => { window.location.href = `accueil.html?livre=${card.dataset.bookId}&depuis=envie`; });
    });
  }

  init().finally(() => document.documentElement.classList.remove('page-loading'));
</script>
</body>
</html>
