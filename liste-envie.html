<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BliGO — Liste d'envie</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], logo: ['Poppins', 'sans-serif'] },
      colors: {
        ink: '#1B4B43',
        brand: 'var(--color-brand, #1B4B43)',
        mango: { 50:'var(--color-mango-50, #FFF7ED)',100:'var(--color-mango-100, #FFEAD2)',200:'var(--color-mango-200, #FFD4A3)',300:'var(--color-mango-300, #FFB86B)',400:'var(--color-mango-400, #FFA33F)',500:'var(--color-mango-500, #FF9B2E)',600:'var(--color-mango-600, #F07F14)',700:'var(--color-mango-700, #C7630F)',800:'var(--color-mango-800, #9E4E12)',900:'var(--color-mango-900, #7C3F12)' },
        hibiscus: { 50:'var(--color-hibiscus-50, #FFF0F5)',100:'var(--color-hibiscus-100, #FFDCE9)',200:'var(--color-hibiscus-200, #FFB8D3)',300:'var(--color-hibiscus-300, #FF8FB9)',400:'var(--color-hibiscus-400, #F2609A)',500:'var(--color-hibiscus-500, #E8437A)',600:'var(--color-hibiscus-600, #C92C61)',700:'var(--color-hibiscus-700, #A3234E)',800:'var(--color-hibiscus-800, #7E1C3D)',900:'var(--color-hibiscus-900, #5F1730)' }
      }
    } }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  html, body { overscroll-behavior-y: contain; }
  body { min-height: 100dvh !important; }
  /* Sur un vrai iPhone (encoche/île dynamique + barre du bas), le contenu
     touche sinon la barre de statut et le menu chevauche la barre du bas. */
  body { padding-top: env(safe-area-inset-top); padding-bottom: calc(6rem + env(safe-area-inset-bottom)) !important; }
  .font-logo { font-family: 'Poppins', sans-serif; }
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px; }
  }
</style>
</head>
<body class="bg-white text-ink min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-white border-b border-mango-100 shadow-sm">
  <div class="max-w-4xl mx-auto px-5 py-3.5">
    <h1 class="text-base font-bold text-ink text-center">Ma Liste d'Envie</h1>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-8">
  <div class="rounded-2xl p-4 text-white shadow-md bg-gradient-to-br from-mango-600 to-hibiscus-700 mb-6 flex items-center justify-between gap-3">
    <div>
      <p class="text-sm font-bold">🔔 Activer mes notifications</p>
      <p class="text-xs text-white/80 mt-0.5">Reçois une alerte dès qu'un livre de ta liste d'envie revient en rayon.</p>
    </div>
    <button id="notif-toggle" type="button" role="switch" aria-checked="false" class="shrink-0 w-11 h-6 rounded-full bg-white/25 relative transition">
      <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"></span>
    </button>
  </div>

  <div id="wishlist-list" class="flex flex-col gap-3"></div>
</main>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.06)]" style="transform: translateZ(0); padding-bottom: env(safe-area-inset-bottom);">
  <div class="max-w-4xl mx-auto w-full flex items-center py-2 px-5">
  <a href="accueil.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5l8-7 8 7"/><path d="M6 10.3V19a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-8.7"/></svg>
    <span class="text-[10.5px] font-semibold whitespace-nowrap">Accueil</span>
  </a>
  <a href="reservations.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <span class="relative">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 1 1 12 0c0 3.8 1.3 5.2 1.3 5.2H4.7S6 13.3 6 9.5Z"/><path d="M10 17.7a2 2 0 0 0 4 0"/></svg>
      <span id="nav-resa-badge" class="hidden absolute -top-1 -right-1.5 min-w-[15px] h-[15px] px-1 rounded-full bg-mango-600 text-white text-[9px] font-bold flex items-center justify-center leading-none">0</span>
    </span>
    <span class="text-[10.5px] font-semibold whitespace-nowrap">Réservation</span>
  </a>
  <a href="liste-envie.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-mango-700">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
    <span class="text-[10.5px] font-semibold whitespace-nowrap">Liste d'envie</span>
  </a>
  <a href="agenda.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="text-[10.5px] font-semibold whitespace-nowrap">Agenda</span>
  </a>
  <a href="profil.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.6" cy="11" r="2"/><path d="M5.6 16c.4-1.7 1.7-2.6 3-2.6s2.6.9 3 2.6"/><path d="M14 9.3h5M14 12.3h5M14 15.3h3.2"/></svg>
    <span class="text-[10.5px] font-semibold whitespace-nowrap">Profil</span>
  </a>
  </div>
</nav>

<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { applyCachedTheme } from './js/theme.js';
  applyCachedTheme();
  import { updateReservationBadge } from './js/navBadge.js';

  let currentUser = null;
  let wishlistRows = [];
  let notificationsEnabled = false;

  function heartIcon(filled) {
    return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>`;
  }

  function renderNotifToggle() {
    const btn = document.getElementById('notif-toggle');
    const dot = btn.querySelector('span');
    btn.setAttribute('aria-checked', String(notificationsEnabled));
    btn.classList.toggle('bg-white', notificationsEnabled);
    btn.classList.toggle('bg-white/25', !notificationsEnabled);
    dot.classList.toggle('bg-mango-600', notificationsEnabled);
    dot.classList.toggle('bg-white', !notificationsEnabled);
    dot.classList.toggle('translate-x-5', notificationsEnabled);
  }

  document.getElementById('notif-toggle').addEventListener('click', async () => {
    notificationsEnabled = !notificationsEnabled;
    renderNotifToggle();
    const { error } = await supabase.from('profiles').update({ notifications_enabled: notificationsEnabled }).eq('id', currentUser.id);
    if (error) {
      notificationsEnabled = !notificationsEnabled;
      renderNotifToggle();
      alert('Erreur : ' + error.message);
    }
  });

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;
    updateReservationBadge(currentUser.id);

    const { data: profile } = await supabase.from('profiles').select('role, notifications_enabled').eq('id', currentUser.id).single();
    notificationsEnabled = !!profile?.notifications_enabled;
    renderNotifToggle();

    await loadWishlist();
  }

  async function loadWishlist() {
    const { data, error } = await supabase
      .from('wishlist')
      .select('book_id, books ( id, title, author, cover_initial, cover_url, available )')
      .eq('user_id', currentUser.id);
    if (error) {
      console.error(error);
      return;
    }
    wishlistRows = data;
    renderWishlist();
  }

  async function removeFromWishlist(bookId) {
    const { error } = await supabase.from('wishlist').delete().eq('user_id', currentUser.id).eq('book_id', bookId);
    if (error) {
      alert('Erreur liste d\'envie : ' + error.message);
      return;
    }
    await loadWishlist();
  }

  function renderWishlist() {
    const list = document.getElementById('wishlist-list');
    if (wishlistRows.length === 0) {
      list.innerHTML = `<p class="text-sm text-ink/40 text-center py-10">Aucun livre dans ta liste d'envie pour le moment. Depuis la fiche d'un livre indisponible, clique sur "Recevoir une alerte" pour l'ajouter ici.</p>`;
      return;
    }
    list.innerHTML = wishlistRows.map(w => {
      const b = w.books;
      if (!b) return '';
      const cov = b.cover_url
        ? `<img src="${b.cover_url}" alt="" class="w-11 aspect-[2/3] object-cover rounded-md shadow-sm shrink-0">`
        : `<div class="w-11 aspect-[2/3] rounded-md bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${b.cover_initial || b.title[0]}</div>`;
      return `
        <div class="bg-white border border-white shadow-md rounded-xl p-3 flex items-center gap-3">
          ${cov}
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-ink">${b.title}</p>
            <p class="text-[11px] text-ink/50">${b.author}</p>
            <span class="mt-1 inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${b.available ? 'bg-mango-50 text-mango-700' : 'bg-brand/5 text-ink/40'}">
              ${b.available ? '● Disponible' : '🔔 Alerte active'}
            </span>
          </div>
          <button data-book-id="${b.id}" class="wishlist-remove-btn w-7 h-7 text-hibiscus-600 shrink-0">${heartIcon(true)}</button>
        </div>`;
    }).join('');
    list.querySelectorAll('.wishlist-remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeFromWishlist(Number(btn.dataset.bookId)));
    });
  }

  init();
</script>
</body>
</html>
