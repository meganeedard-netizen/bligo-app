<style>
  body { font-family: 'Inter', sans-serif; }
  html, body { overscroll-behavior-y: contain; }
  body { min-height: 100dvh !important; }
  /* Sur un vrai iPhone (encoche/île dynamique + barre du bas), le contenu
     touche sinon la barre de statut et le menu chevauche la barre du bas. */
  body { padding-top: env(safe-area-inset-top); padding-bottom: calc(6rem + env(safe-area-inset-bottom)) !important; }
  /* Bande blanche sous l'heure et la batterie (23/10/2026) : le contenu et l'en-tête ne passent plus dessous en faisant défiler. */
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #fff; z-index: 40; }
  header.sticky { top: env(safe-area-inset-top); }
  .font-logo { font-family: 'Poppins', sans-serif; }
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px; }
  }
</style>
<!-- Contenu masqué tant que la page n'a pas ses vraies données (23/10/2026) :
     plus de flash de « 0 point » ou de page vide. Sécurité : affiché au bout de 2,5 s quoi qu'il arrive. -->
<style>
  html.page-loading main { visibility: hidden; }
  /* Trois points de chargement orange (23/10/2026), visibles seulement si la page met plus d'un quart de seconde. */
  html.page-loading::after {
    content: ''; position: fixed; left: 50%; top: 45%; z-index: 35;
    width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; opacity: 0;
    background: var(--color-mango-200, #FFD4A3);
    box-shadow: -28px 0 0 var(--color-mango-200, #FFD4A3), 28px 0 0 var(--color-mango-200, #FFD4A3);
    animation: bligo-dots-in 0.2s 0.25s forwards, bligo-dots 1.2s 0.25s infinite;
  }
  html.has-snapshot::after { display: none; }
  @keyframes bligo-dots-in { to { opacity: 1; } }
  @keyframes bligo-dots {
    0%, 100% { box-shadow: -28px 0 0 var(--color-mango-500, #FF9B2E), 28px 0 0 var(--color-mango-200, #FFD4A3); background: var(--color-mango-200, #FFD4A3); }
    33% { box-shadow: -28px 0 0 var(--color-mango-200, #FFD4A3), 28px 0 0 var(--color-mango-200, #FFD4A3); background: var(--color-mango-500, #FF9B2E); }
    66% { box-shadow: -28px 0 0 var(--color-mango-200, #FFD4A3), 28px 0 0 var(--color-mango-500, #FF9B2E); background: var(--color-mango-200, #FFD4A3); }
  }
</style>
<script>document.documentElement.classList.add('page-loading'); setTimeout(function () { if (window.bligoPageReady) window.bligoPageReady(); else document.documentElement.classList.remove('page-loading'); }, 2500);</script>
</head>
<body class="bg-white text-ink min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-white shadow-sm">
  <div class="max-w-4xl mx-auto px-5 py-3">
    <h1 class="text-lg font-semibold text-ink/70 text-center">Agenda culturel</h1>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-5">

  <div class="flex gap-1 p-1 mb-5 bg-[#EEEDF2] rounded-xl md:max-w-sm md:mx-auto">
    <button id="tab-upcoming" onclick="switchAgendaTab('upcoming')" class="flex-1 text-sm font-semibold rounded-lg py-2 bg-white text-ink shadow-sm">À venir</button>
    <button id="tab-history" onclick="switchAgendaTab('history')" class="flex-1 text-sm font-semibold rounded-lg py-2 text-ink/55">Historique</button>
  </div>

  <!-- Ordinateur (22/10/2026) : une carte par ligne, en pleine largeur comme Mes réservations. -->
  <div id="events-list" class="flex flex-col gap-4"></div>

</main>
<script src="js/snapshot.js?v=20261023"></script>

<div id="event-modal-backdrop" onclick="closeEventModal(event)" class="hidden fixed inset-0 z-40 bg-black/40 items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[85vh] overflow-y-auto relative">
    <button onclick="closeEventModal()" aria-label="Fermer" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/90 text-ink/60 flex items-center justify-center text-lg z-10">✕</button>
    <div id="event-modal-content" class="p-6"></div>
  </div>
</div>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.06)]" style="transform: translateZ(0); padding-bottom: env(safe-area-inset-bottom);">
  <div class="max-w-4xl mx-auto w-full flex items-stretch pt-2 pb-1.5 px-1">

    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Accueil</span>
  </a>
  <a href="reservations.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 1 1 12 0c0 3.8 1.3 5.2 1.3 5.2H4.7S6 13.3 6 9.5Z"/><path d="M10 17.7a2 2 0 0 0 4 0"/></svg>
      <span id="nav-resa-badge" class="hidden absolute -top-1 -right-1.5 min-w-[15px] h-[15px] px-1 rounded-full bg-mango-600 text-white text-[9px] font-bold flex items-center justify-center leading-none">0</span>
    </span>

    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Favoris</span>
  </a>
  <a href="agenda.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-mango-700">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Agenda</span>
  </a>
  <a href="profil.html" class="flex-1 min-w-0 flex flex-col items-center gap-1 py-1 text-ink/40 hover:text-ink">

    <span class="text-[12px] font-semibold whitespace-nowrap tracking-tight">Profil</span>

<script type="module">
  import { supabase } from './js/supabaseClient.js?v=20261023';
  import { applyCachedTheme, applyCommuneTheme } from './js/theme.js?v=20261016d';
  applyCachedTheme();
  import { updateReservationBadge } from './js/navBadge.js?v=20261023';
  import { showSnackbar, showDialog, frError } from './js/ui.js?v=20261023';



  let currentUser = null;
  let browseCommuneId = null;
  let events = [];
  let myRsvps = new Set();
  let rsvpCounts = {};

  // « Samedi 24 octobre à 09:00 » : majuscule sur le premier mot seulement.
  const capFirst = t => t ? t[0].toUpperCase() + t.slice(1) : t;

  function formatEventDate(iso, durationMinutes) {
    const start = new Date(iso);
    const startText = start.toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    if (!durationMinutes) return startText;
    const end = new Date(start.getTime() + durationMinutes * 60 * 1000);
    const endText = end.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `${startText} - ${endText}`;
  }

  let agendaTab = 'upcoming';
  let myCheckins = new Set();

  // Chargement accéléré (23/10/2026) : les demandes partent en même temps,
  // et seules les inscriptions des événements affichés sont récupérées.
  async function loadEvents() {
    const [{ data: eventsData, error }, { data: checkinsData }] = await Promise.all([
      supabase.from('events').select('*, communes ( name )').eq('commune_id', browseCommuneId).order('event_date', { ascending: true }),
      currentUser ? supabase.from('event_checkins').select('event_id').eq('user_id', currentUser.id) : Promise.resolve({ data: [] }),
    ]);
    if (error) {
      console.error(error);
      return;
    }
    events = eventsData || [];

    const { data: rsvpsData } = events.length
      ? await supabase.from('event_rsvps').select('event_id, user_id').in('event_id', events.map(e => e.id))
      : { data: [] };
    rsvpCounts = {};
    myRsvps = new Set();
    (rsvpsData || []).forEach(r => {
      rsvpCounts[r.event_id] = (rsvpCounts[r.event_id] || 0) + 1;
      if (currentUser && r.user_id === currentUser.id) myRsvps.add(r.event_id);
    });
    myCheckins = new Set((checkinsData || []).map(c => c.event_id));

    renderEvents();
  }

  window.switchAgendaTab = function (tab) {
    agendaTab = tab;
    document.getElementById('tab-upcoming').className = 'flex-1 text-sm font-semibold rounded-lg py-2 ' + (tab === 'upcoming' ? 'bg-white text-ink shadow-sm' : 'text-ink/55');
    document.getElementById('tab-history').className = 'flex-1 text-sm font-semibold rounded-lg py-2 ' + (tab === 'history' ? 'bg-white text-ink shadow-sm' : 'text-ink/55');
    renderEvents();
  };

  const EVENT_ICONS = {
    book: '<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/>',
    moon: '<path d="M15 3.5a7.5 7.5 0 1 0 5.5 12.6A9 9 0 0 1 15 3.5Z"/><path d="M19 3.3l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5Z"/>',
    pen: '<path d="M4 20.5l1-4L15.5 6l3 3L8 19.5l-4 1Z"/><path d="M13.5 7.5l3 3"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/>',
    music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    mask: '<path d="M4 4h16v8a8 8 0 0 1-16 0V4Z"/><path d="M8.5 9h.01M15.5 9h.01"/><path d="M9 14c1.7 1.4 4.3 1.4 6 0"/>',
    star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>',
    frame: '<rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 16l5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.3"/>',
    chat: '<path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3.5V15H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3l-3-3h-4"/>',
  };

  function iconForEvent(eventType) {
    const t = (eventType || '').toLowerCase();
    if (t.includes('club de lecture')) return EVENT_ICONS.book;
    if (t.includes('heure du conte')) return EVENT_ICONS.moon;
    if (t.includes('atelier')) return EVENT_ICONS.pen;
    if (t.includes('concert')) return EVENT_ICONS.music;
    if (t.includes('théâtre')) return EVENT_ICONS.mask;
    if (t.includes('spectacle')) return EVENT_ICONS.star;
    if (t.includes('cinéma')) return EVENT_ICONS.film;
    if (t.includes('conférence')) return EVENT_ICONS.mic;
    if (t.includes('exposition')) return EVENT_ICONS.frame;
    if (t.includes('débat')) return EVENT_ICONS.chat;
    return EVENT_ICONS.calendar;
  }

  function eventDetailHtml(e) {
    const hours = Math.floor((e.duration_minutes || 90) / 60);
    const mins = (e.duration_minutes || 90) % 60;
    const durationLabel = [hours ? `${hours} h` : '', mins ? `${mins} min` : ''].filter(Boolean).join(' ');
    return `
      ${e.image_url ? `<img src="${e.image_url}" alt="" class="w-full aspect-[4/3] object-cover rounded-xl mb-4">` : ''}
      <p class="text-xl font-bold text-ink leading-snug">${e.event_type || 'Événement'}</p>
      ${e.title ? `<p class="text-base text-ink/60 mt-0.5">${e.title}</p>` : ''}
      <p class="text-sm text-hibiscus-700 font-semibold mt-3">${capFirst(formatEventDate(e.event_date, e.duration_minutes))} · ${durationLabel}</p>
      <p class="text-sm text-ink/60 mt-1">📍 ${e.location || ''}${e.communes?.name ? ' · ' + e.communes.name : ''}</p>
      ${e.description ? `<p class="text-sm text-ink/70 leading-relaxed mt-3">${e.description}</p>` : ''}
    `;
  }

  window.openEventModal = function (id) {
    const e = events.find(x => x.id === id);
    if (!e) return;
    document.getElementById('event-modal-content').innerHTML = eventDetailHtml(e);
    document.getElementById('event-modal-backdrop').classList.remove('hidden');
    document.getElementById('event-modal-backdrop').classList.add('flex');
  };

  window.closeEventModal = function (event) {
    if (event && event.target.id !== 'event-modal-backdrop') return;
    document.getElementById('event-modal-backdrop').classList.add('hidden');
    document.getElementById('event-modal-backdrop').classList.remove('flex');
  };

  function renderEvents() {
    const list = document.getElementById('events-list');
    const now = new Date();

    if (agendaTab === 'history') {
      const past = events
        .filter(e => new Date(e.event_date) < now && myRsvps.has(e.id))
        .sort((a, b) => new Date(b.event_date) - new Date(a.event_date));

      if (past.length === 0) {
        list.innerHTML = `<p class="text-sm text-ink/40 text-center py-10">Aucun événement passé pour l'instant. Les événements auxquels tu t'inscris apparaîtront ici une fois passés.</p>`;
        return;
      }

      list.innerHTML = past.map(e => `
        <div onclick="openEventModal(${e.id})" class="cursor-pointer bg-white shadow-sm rounded-2xl p-4 flex gap-4 opacity-80 w-full">
          <div class="w-12 h-12 rounded-xl bg-brand/10 flex items-center justify-center text-ink/50 shrink-0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconForEvent(e.event_type)}</svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-ink">${e.event_type || 'Événement'}</p>
            ${e.title ? `<p class="text-xs text-ink/55">${e.title}</p>` : ''}
            <p class="text-[11px] text-ink/45 font-semibold mt-0.5">${capFirst(formatEventDate(e.event_date, e.duration_minutes))}</p>
            <p class="text-[11px] text-ink/45 mt-0.5">${e.location || ''}${e.communes?.name ? ' · ' + e.communes.name : ''}</p>
            <span class="inline-block mt-2 text-[10.5px] font-semibold rounded-lg px-2 py-1 ${myCheckins.has(e.id) ? 'bg-mango-50 text-mango-700' : 'bg-brand/5 text-ink/40'}">
              ${myCheckins.has(e.id) ? 'Présence confirmée' : 'Inscrit·e'}
            </span>
          </div>
        </div>`).join('');
      return;
    }

    const upcoming = events.filter(e => new Date(e.event_date) >= now);
    if (upcoming.length === 0) {
      list.innerHTML = `<p class="text-sm text-ink/40 text-center py-10">Aucun événement à venir pour le moment.</p>`;
      return;
    }
    list.innerHTML = upcoming.map(e => {
      const attending = myRsvps.has(e.id);
      const count = rsvpCounts[e.id] || 0;
      const full = e.max_seats != null && count >= e.max_seats && !attending;
      const seatsLabel = e.max_seats != null ? `${count} / ${e.max_seats} place${e.max_seats > 1 ? 's' : ''}` : `${count} inscrit${count > 1 ? 's' : ''}`;
      // Carte resserrée (23/10/2026) : description sur 2 lignes (en entier en
      // touchant la carte), boutons sur une ligne, « Me désinscrire » en lien.
      const calIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>';
      return `
        <div onclick="openEventModal(${e.id})" class="cursor-pointer bg-white shadow-sm rounded-2xl p-3.5 flex gap-3 w-full">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white shrink-0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconForEvent(e.event_type)}</svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-ink leading-snug">${e.event_type || 'Événement'}${e.title ? `<span class="font-medium text-ink/55"> · ${e.title}</span>` : ''}</p>
            <p class="text-[11px] text-hibiscus-700 font-semibold mt-0.5">${capFirst(formatEventDate(e.event_date, e.duration_minutes))}</p>
            <p class="text-[11px] text-ink/45 truncate">${e.location || ''}${e.communes?.name ? ' · ' + e.communes.name : ''}</p>
            ${e.description ? `<p class="text-xs text-ink/60 leading-relaxed mt-1.5 line-clamp-2">${e.description}</p>` : ''}
            <div class="flex items-center gap-2 mt-2.5">
              ${attending
                ? `<span class="text-xs font-semibold rounded-lg px-2.5 py-1.5 bg-mango-50 text-mango-700 whitespace-nowrap">Inscrit ✓</span>
                   <button data-event-id="${e.id}" class="ics-btn flex items-center gap-1.5 text-xs font-semibold rounded-lg px-2.5 py-1.5 bg-[#EEEDF2] text-ink/70 whitespace-nowrap">${calIcon}Calendrier</button>`
                : `<button data-event-id="${e.id}" ${full ? 'disabled' : ''} class="rsvp-btn text-xs font-semibold rounded-lg px-3 py-1.5 whitespace-nowrap ${full ? 'bg-[#EEEDF2] text-ink/35' : 'bg-mango-500 text-white shadow-sm'}">${full ? 'Complet' : "Je m'inscris"}</button>`}
              <span class="ml-auto text-[10.5px] text-ink/40 whitespace-nowrap">${seatsLabel}</span>
            </div>
            ${attending ? `<button data-event-id="${e.id}" class="unrsvp-btn mt-1.5 text-[11px] font-semibold text-ink/45 underline">Me désinscrire</button>` : ''}
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('.rsvp-btn:not(:disabled), .unrsvp-btn').forEach(btn => {
      btn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleRsvp(Number(btn.dataset.eventId)); });
    });
    list.querySelectorAll('.ics-btn').forEach(btn => {
      btn.addEventListener('click', (ev) => { ev.stopPropagation(); downloadIcsForEvent(Number(btn.dataset.eventId)); });
    });
  }

  // Génère un fichier .ics téléchargeable pour que l'usager puisse ajouter
  // l'événement à son propre calendrier (téléphone, Outlook, Google Agenda…),
  // en sortant de l'appli.
  function downloadIcsForEvent(eventId) {
    const e = events.find(x => x.id === eventId);
    if (!e) return;

    const start = new Date(e.event_date);
    const end = new Date(start.getTime() + (e.duration_minutes || 90) * 60 * 1000);
    const fmt = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const escapeIcs = (s) => (s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
    const location = e.location ? (e.communes?.name ? `${e.location}, ${e.communes.name}` : e.location) : (e.communes?.name || '');

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//BliGO//Agenda culturel//FR',
      'BEGIN:VEVENT',
      `UID:bligo-event-${e.id}@bligo.app`,
      `DTSTAMP:${fmt(new Date())}`,
      `DTSTART:${fmt(start)}`,
      `DTEND:${fmt(end)}`,
      `SUMMARY:${escapeIcs(e.event_type ? (e.event_type + (e.title ? ' : ' + e.title : '')) : e.title)}`,
      location ? `LOCATION:${escapeIcs(location)}` : '',
      e.description ? `DESCRIPTION:${escapeIcs(e.description)}` : '',
      'END:VEVENT',
      'END:VCALENDAR',
    ].filter(Boolean).join('\r\n');

    const filename = `${(e.event_type || e.title || 'evenement').replace(/[^\w\- ]/g, '').trim() || 'evenement'}.ics`;

    // Dans l'app (iOS/Android), un simple lien de téléchargement ne fait rien
    // et le navigateur système refuse un fichier « data: » (23/10/2026). On
    // ouvre donc bligo.app/calendrier.php dans Safari/Chrome, qui renvoie le
    // fichier et propose directement « Ajouter au calendrier ».
    // iPhone (23/10/2026) : fenêtre d'agenda d'Apple par-dessus l'appli,
    // l'usager choisit son agenda, touche « Ajouter » et reste dans BliGO.
    // Appli iPhone et Android (23/10/2026) : fenêtre d'agenda du téléphone
    // par-dessus BliGO (iPhone) ou appli d'agenda (Android), l'usager choisit
    // son agenda, enregistre et revient dans BliGO. Module maison :
    // CalendarPlugin.swift / CalendarPlugin.java. Repli par le navigateur
    // (bligo.app/calendrier.php) si le module est absent.
    if (window.Capacitor?.isNativePlatform?.()) {
      const openInBrowser = () => {
        const base64 = btoa(unescape(encodeURIComponent(ics))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        window.open(`https://bligo.app/calendrier.php?ics=${base64}`, '_system');
      };
      const BligoCalendar = window.Capacitor.Plugins?.BligoCalendar;
      if (!BligoCalendar) { openInBrowser(); return; }
      BligoCalendar.addEvent({
        title: e.event_type ? (e.event_type + (e.title ? ' : ' + e.title : '')) : e.title,
        location,
        notes: e.description || '',
        start: start.getTime(),
        end: end.getTime(),
      }).then(r => { if (r?.added) showSnackbar('Événement ajouté à ton calendrier.'); })
        .catch(err => {
          if (err?.code === 'UNIMPLEMENTED') { openInBrowser(); return; }
          showSnackbar(window.Capacitor.getPlatform() === 'ios'
            ? "Impossible d'ouvrir le calendrier. Vérifie l'accès au calendrier dans les Réglages."
            : "Aucune appli d'agenda trouvée sur ce téléphone.");
        });
      return;
    }

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function formatDelay(hours) {
    if (hours % 168 === 0) return hours === 168 ? '1 semaine' : `${hours / 168} semaines`;
    return `${hours} h`;
  }

  // Sans compte (12/10/2026) : on explique sur place avant d'envoyer vers l'inscription.
  function askAccountForEvent(ev) {
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const backdrop = document.createElement('div');
    backdrop.className = 'fixed inset-0 z-50 bg-brand/50 backdrop-blur-sm flex items-center justify-center p-4';
    backdrop.innerHTML = `
      <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">
        <p class="text-base font-bold text-ink mb-2">Crée ton compte pour t'inscrire</p>
        <p class="text-sm text-ink/70 leading-relaxed">${ev ? `Pour t'inscrire à <strong>${esc(ev.title)}</strong>, tu as besoin d'un compte BliGO.` : "Pour t'inscrire à un événement, tu as besoin d'un compte BliGO."} Ça ne prend que 2 minutes.</p>
        <a href="index.html?gate=event" class="block w-full mt-5 bg-brand text-white rounded-2xl py-3 text-base font-semibold active:scale-[0.98] transition">Créer mon compte</a>
        <p class="mt-4 text-sm text-ink/70">J'ai déjà un compte - <a href="index.html?login=1" class="font-semibold text-mango-700">Se connecter</a></p>
        <button data-a="cancel" class="w-full mt-1 text-sm font-semibold text-ink/50 py-2">Annuler</button>
      </div>`;
    backdrop.querySelector('[data-a="cancel"]').onclick = () => backdrop.remove();
    backdrop.onclick = e => { if (e.target === backdrop) backdrop.remove(); };
    document.body.appendChild(backdrop);
  }

  function confirmRsvp(ev) {
    const start = new Date(ev.event_date);
    const day = start.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const hour = start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const delay = formatDelay(ev.unsubscribe_hours || 48);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    return new Promise(resolve => {
      const backdrop = document.createElement('div');
      backdrop.className = 'fixed inset-0 z-50 bg-brand/50 backdrop-blur-sm flex items-center justify-center p-4';
      backdrop.innerHTML = `
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
          <p class="text-base font-bold text-ink mb-1">${esc(ev.title)}</p>
          <p class="text-sm font-semibold text-mango-700 mb-4">Le ${day} à ${hour}</p>
          <p class="text-sm text-ink/70 leading-relaxed">Tu vas t'inscrire à <strong>${esc(ev.title)}</strong> le ${day} à ${hour}.</p>
          <p class="text-sm text-ink/70 leading-relaxed mt-3">Les places sont limitées : en t'inscrivant, tu t'engages à être présent·e. Si tu ne peux plus venir, pense à te désinscrire au moins <strong>${delay}</strong> avant pour libérer ta place.</p>
          <button data-a="ok" class="w-full mt-5 bg-brand text-white rounded-2xl py-3 text-base font-semibold active:scale-[0.98] transition">Confirmer mon inscription</button>
          <button data-a="cancel" class="w-full mt-2 text-sm font-semibold text-ink/50 py-2">Annuler</button>
        </div>`;
      const close = ok => { backdrop.remove(); resolve(ok); };
      backdrop.querySelector('[data-a="ok"]').onclick = () => close(true);
      backdrop.querySelector('[data-a="cancel"]').onclick = () => close(false);
      backdrop.onclick = e => { if (e.target === backdrop) close(false); };
      document.body.appendChild(backdrop);
    });
  }

  async function toggleRsvp(eventId) {
    // Sans compte : l'agenda se consulte librement, l'inscription demande un compte (12/10/2026).
    if (!currentUser) { askAccountForEvent(events.find(e => e.id === eventId)); return; }
    // Confirmation avant de s'inscrire (12/10/2026) : places limitées et délai
    // de désinscription réglé par la médiathèque (48 h par défaut).
    if (!myRsvps.has(eventId)) {
      const ev = events.find(e => e.id === eventId);
      if (ev && !(await confirmRsvp(ev))) return;
    }
    if (myRsvps.has(eventId)) {
      // Désinscription confirmée (16/10/2026) : avant, recliquer désinscrivait
      // sans aucun message.
      const choice = await showDialog({
        title: 'Tu es sûr de vouloir annuler ta place ?',
        buttons: [{ label: 'Je me désinscris', value: true, primary: true }, { label: 'Je reste inscrit', value: false }],
      });
      if (choice !== true) return;
      await supabase.from('event_rsvps').delete().eq('event_id', eventId).eq('user_id', currentUser.id);
      showSnackbar('Ta place est annulée.');
    } else {
      // La jauge est aussi vérifiée côté base (trigger), au cas où deux usagers
      // se disputeraient la dernière place en même temps.
      const { error } = await supabase.from('event_rsvps').insert({ event_id: eventId, user_id: currentUser.id });
      if (error) showDialog({ message: frError(error) });
      else showSnackbar('Inscription confirmée !');
    }
    await loadEvents();
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    // Médiathèque consultée : celle mémorisée par l'accueil (aussi pour un
    // usager connecté, voir accueil.html), vérifiée en parallèle du reste.
    let stored = null;
    try { stored = Number(localStorage.getItem('bligo_guest_commune_id')) || null; } catch {}
    if (session) {
      currentUser = session.user;
      updateReservationBadge(currentUser.id);
    }
    const profilePromise = session
      ? supabase.from('profiles').select('commune_id').eq('id', currentUser.id).single()
      : Promise.resolve({ data: null });
    if (!stored) {
      // Rien de mémorisé : on attend le profil (usager connecté), sinon retour au choix.
      const { data: profile } = await profilePromise;
      stored = profile?.commune_id || null;
      if (!stored) { window.location.href = 'index.html'; return; }
    }
    browseCommuneId = stored;
    const [{ data: profile }, { data: commune }] = await Promise.all([
      profilePromise,
      supabase.from('communes').select('name, theme_ink_hex, theme_accent_hex').eq('id', browseCommuneId).single(),
      loadEvents(),
    ]);
    // Usager connecté : toujours l'agenda de sa médiathèque (16/10/2026).
    if (profile?.commune_id && profile.commune_id !== browseCommuneId) {
      try { localStorage.setItem('bligo_guest_commune_id', String(profile.commune_id)); } catch {}
      browseCommuneId = profile.commune_id;
      await loadEvents();
    }
    // Médiathèque qui n'existe plus (Sainte-Anne, retirée le 21/10/2026).
    if (!commune && !profile?.commune_id) {
      try { localStorage.removeItem('bligo_guest_commune_id'); } catch {}
      window.location.href = 'index.html';
      return;
    }
    if (commune) applyCommuneTheme(commune);
  }

  window.logout = async function () {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  };

  init().finally(() => window.bligoPageReady ? window.bligoPageReady() : document.documentElement.classList.remove('page-loading'));
</script>
</body>
