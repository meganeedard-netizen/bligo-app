<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BliGO — Connexion</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], logo: ['Poppins', 'sans-serif'] },
      colors: {
        ink: '#1B4B43',
        mango: { 50:'#FFF7ED',100:'#FFEAD2',200:'#FFD4A3',300:'#FFB86B',400:'#FFA33F',500:'#FF9B2E',600:'#F07F14',700:'#C7630F',800:'#9E4E12',900:'#7C3F12' },
        hibiscus: { 50:'#FFF0F5',100:'#FFDCE9',200:'#FFB8D3',300:'#FF8FB9',400:'#F2609A',500:'#E8437A',600:'#C92C61',700:'#A3234E',800:'#7E1C3D',900:'#5F1730' }
      }
    } }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-logo { font-family: 'Poppins', sans-serif; }
</style>
</head>
<body class="bg-[#FFF4E4] text-ink min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-1.5 mb-8">
      <img src="img/bligo-logo.png" alt="BliGO" class="w-40 h-auto">
      <p class="text-xs text-ink/50 font-medium">L'appli du livre gratuit</p>
    </div>

    <div class="bg-white border border-mango-100 rounded-2xl shadow-sm p-6">
      <div class="flex items-center gap-1 bg-mango-50 border border-mango-100 rounded-full p-1 mb-5">
        <button id="tab-login" onclick="switchTab('login')" class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-full">Se connecter</button>
        <button id="tab-signup" onclick="switchTab('signup')" class="auth-tab flex-1 text-sm font-semibold py-1.5 rounded-full">Créer un compte</button>
      </div>

      <!-- LOGIN -->
      <form id="form-login" class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-semibold text-ink/60 block mb-1">E-mail</label>
          <input required type="email" id="login-email" class="w-full border border-mango-100 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-semibold text-ink/60">Mot de passe</label>
            <button type="button" onclick="forgotPassword()" class="text-xs font-semibold text-mango-700 hover:text-mango-800">Mot de passe oublié ?</button>
          </div>
          <div class="relative">
            <input required type="password" id="login-password" class="w-full border border-mango-100 rounded-lg pl-3 pr-9 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300">
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="pw-toggle-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-ink/40 hover:text-ink/70"></button>
          </div>
        </div>
        <button type="submit" class="mt-1 w-full bg-ink text-white rounded-lg py-2.5 text-sm font-semibold active:scale-[0.98] transition">Se connecter</button>
      </form>

      <!-- SIGNUP -->
      <form id="form-signup" class="hidden flex-col gap-3">
        <div>
          <label class="text-xs font-semibold text-ink/60 block mb-1">Nom complet</label>
          <input required type="text" id="signup-name" class="w-full border border-mango-100 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/60 block mb-1">E-mail</label>
          <input required type="email" id="signup-email" class="w-full border border-mango-100 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/60 block mb-1">Mot de passe</label>
          <div class="relative">
            <input required minlength="6" type="password" id="signup-password" class="w-full border border-mango-100 rounded-lg pl-3 pr-9 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300">
            <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="pw-toggle-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-ink/40 hover:text-ink/70"></button>
          </div>
        </div>
        <button type="submit" class="mt-1 w-full bg-mango-600 text-white rounded-lg py-2.5 text-sm font-semibold active:scale-[0.98] transition">Créer mon compte</button>
      </form>

      <p id="auth-message" class="text-xs text-center mt-3"></p>
    </div>

    <p class="text-[11px] text-ink/35 text-center mt-6">BliGO — l'appli du livre gratuit</p>
  </div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const eyeIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOffIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.4 15.4 0 0 1-3.2 4.1M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.6-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

  document.querySelectorAll('.pw-toggle-btn').forEach(btn => {
    btn.innerHTML = eyeIcon;
  });

  window.togglePasswordVisibility = function (inputId, btn) {
    const input = document.getElementById(inputId);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.innerHTML = showing ? eyeIcon : eyeOffIcon;
  };

  window.forgotPassword = async function () {
    const email = document.getElementById('login-email').value.trim();
    if (!email) {
      messageEl.textContent = 'Indique d\'abord ton e-mail ci-dessus, puis clique à nouveau sur "Mot de passe oublié ?".';
      messageEl.className = 'text-xs text-center mt-3 text-ink/60';
      return;
    }
    messageEl.textContent = 'Envoi en cours…';
    messageEl.className = 'text-xs text-center mt-3 text-ink/50';
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    if (error) {
      messageEl.textContent = error.message;
      messageEl.className = 'text-xs text-center mt-3 text-red-600';
      return;
    }
    messageEl.textContent = 'E-mail envoyé si un compte existe avec cette adresse. Vérifie ta boîte mail.';
    messageEl.className = 'text-xs text-center mt-3 text-mango-700';
  };

  window.switchTab = function (tab) {
    document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
    document.getElementById('form-login').classList.toggle('flex', tab === 'login');
    document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('form-signup').classList.toggle('flex', tab === 'signup');
    document.getElementById('tab-login').classList.toggle('bg-white', tab === 'login');
    document.getElementById('tab-login').classList.toggle('shadow-sm', tab === 'login');
    document.getElementById('tab-login').classList.toggle('text-ink', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('bg-white', tab === 'signup');
    document.getElementById('tab-signup').classList.toggle('shadow-sm', tab === 'signup');
    document.getElementById('tab-signup').classList.toggle('text-ink', tab === 'signup');
    document.getElementById('auth-message').textContent = '';
  };
  switchTab('login');

  const messageEl = document.getElementById('auth-message');

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    messageEl.textContent = 'Connexion…';
    messageEl.className = 'text-xs text-center mt-3 text-ink/50';
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      messageEl.textContent = error.message;
      messageEl.className = 'text-xs text-center mt-3 text-red-600';
      return;
    }
    window.location.href = 'accueil.html';
  });

  document.getElementById('form-signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    messageEl.textContent = 'Création du compte…';
    messageEl.className = 'text-xs text-center mt-3 text-ink/50';
    const full_name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name } } });
    if (error) {
      messageEl.textContent = error.message;
      messageEl.className = 'text-xs text-center mt-3 text-red-600';
      return;
    }
    messageEl.textContent = 'Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse, puis connectez-vous.';
    messageEl.className = 'text-xs text-center mt-3 text-mango-700';
  });

  // Déjà connecté ? on saute directement au catalogue.
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'accueil.html';
  });
</script>
</body>
</html>
