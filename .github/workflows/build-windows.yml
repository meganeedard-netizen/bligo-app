# Fabrication du logiciel agent BliGO pour Windows (09/10/2026)
# ============================================================
# GitHub compile le logiciel Tauri sur une machine Windows à chaque mise à
# jour des pages du back-office (ou à la demande, onglet Actions > « Run
# workflow »). L'installateur (.exe et .msi) se télécharge dans l'onglet
# Actions, rubrique « Artifacts » de la dernière exécution.
name: Logiciel agent Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'superadmin.html'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'img/**'
      - 'tauri-app/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Dépendances
        run: npm ci

      - name: Préparation des pages du back-office
        run: node sync-web.mjs

      - name: Compilation (installateurs .exe et .msi)
        run: npx tauri build --bundles nsis,msi --config '{"build":{"beforeBuildCommand":""}}' 2>&1 | tail -80; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Mise à disposition de l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: BliGO-Agent-Windows
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Publication sur la page « Releases » du dépôt : téléchargement direct,
      # sans compte GitHub (le PC d'une médiathèque peut le récupérer tel quel).
      - name: Publication de la version Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-windows-${{ github.run_number }}
          name: BliGO Agent pour Windows (version ${{ github.run_number }})
          body: |
            Logiciel agent BliGO pour Windows, fabriqué automatiquement à partir du back-office.
            Installer le fichier « setup.exe ». Au premier lancement, Windows peut afficher
            « Windows a protégé votre ordinateur » (logiciel pas encore signé) : cliquer sur
            « Informations complémentaires » puis « Exécuter quand même ».
          make_latest: true
          files: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi

