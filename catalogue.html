<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BliGO — Catalogue</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], logo: ['Poppins', 'sans-serif'] },
      colors: {
        ink: '#1B4B43',
        mango: { 50:'#FFF7ED',100:'#FFEAD2',200:'#FFD4A3',300:'#FFB86B',400:'#FFA33F',500:'#FF9B2E',600:'#F07F14',700:'#C7630F',800:'#9E4E12',900:'#7C3F12' },
        hibiscus: { 50:'#FFF0F5',100:'#FFDCE9',200:'#FFB8D3',300:'#FF8FB9',400:'#F2609A',500:'#E8437A',600:'#C92C61',700:'#A3234E',800:'#7E1C3D',900:'#5F1730' }
      }
    } }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-logo { font-family: 'Poppins', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body class="bg-[#FFF4E4] text-ink min-h-screen">

<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-mango-100 shadow-sm">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between flex-wrap gap-y-2 gap-x-3">
    <div class="flex items-center gap-2.5">
      <img src="img/bligo-icon.png" alt="BliGO" class="w-8 h-8 object-contain">
      <div>
        <p class="font-logo font-bold text-base text-ink leading-none">Bli<span class="text-mango-600">GO</span></p>
        <p class="text-[11px] text-ink/45 leading-none mt-0.5">Médiathèque de Val-Fleuri</p>
      </div>
    </div>
    <nav class="flex items-center gap-1 bg-mango-50 border border-mango-100 rounded-full p-1">
      <a href="accueil.html" class="text-xs font-semibold px-3 py-1.5 rounded-full text-ink/50 hover:text-ink">Accueil</a>
      <a href="catalogue.html" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-white shadow-sm text-ink">Catalogue</a>
      <a href="bibliotheque-libre.html" class="text-xs font-semibold px-3 py-1.5 rounded-full text-ink/50 hover:text-ink whitespace-nowrap">Bibliothèque Libre</a>
    </nav>
    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="openCardModal()" class="text-xs font-semibold text-ink/70 hover:text-ink border border-mango-100 rounded-full px-3 py-1.5 whitespace-nowrap">Ma carte</button>
      <a id="admin-link" href="admin.html" class="hidden text-xs font-semibold text-mango-700 hover:text-mango-800 border border-mango-200 bg-mango-50 rounded-full px-3 py-1.5 whitespace-nowrap">Back-office</a>
      <span id="user-name" class="text-xs font-semibold text-ink/70 hidden sm:inline"></span>
      <button onclick="logout()" class="text-xs font-semibold text-ink/50 hover:text-ink border border-mango-100 rounded-full px-3 py-1.5 whitespace-nowrap">Déconnexion</button>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-8">

  <section class="mb-10">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-bold text-ink">Catalogue</h1>
      <span id="catalogue-status" class="text-xs text-ink/40"></span>
    </div>
    <input id="search-input" type="text" placeholder="Rechercher un titre, un auteur…"
      class="w-full border border-mango-100 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-mango-300 mb-3">
    <div id="category-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-1"></div>
    <div id="book-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </section>

  <section>
    <h2 class="text-lg font-bold text-ink mb-4">Mes réservations</h2>
    <div id="reservations-list" class="flex flex-col gap-3"></div>
  </section>

</main>

<!-- Overlay détail livre -->
<div id="book-modal-backdrop" onclick="closeBookModal(event)" class="hidden fixed inset-0 z-40 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4">
  <div id="book-modal-card" class="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[85vh] overflow-y-auto relative">
    <button onclick="closeBookModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 border border-mango-100 text-ink/50 hover:text-ink flex items-center justify-center text-sm font-bold z-10">✕</button>
    <div id="book-modal-content" class="p-6"></div>
  </div>
</div>

<!-- Overlay carte usager -->
<div id="card-modal-backdrop" onclick="closeCardModal(event)" class="hidden fixed inset-0 z-40 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="max-w-sm w-full relative">
    <button onclick="closeCardModal()" class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-white shadow-md text-ink/50 hover:text-ink flex items-center justify-center text-sm font-bold z-10">✕</button>
    <div class="rounded-2xl p-6 text-white shadow-xl bg-gradient-to-br from-hibiscus-700 via-hibiscus-600 to-mango-600 relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10"></div>
      <div class="absolute -right-2 bottom-6 w-16 h-16 rounded-full bg-white/10"></div>
      <p class="font-logo font-bold text-sm relative">Bli<span class="text-mango-200">GO</span></p>
      <p class="text-[11px] text-white/70 relative mb-4">Médiathèque de Val-Fleuri</p>

      <p id="card-name" class="text-lg font-bold relative"></p>
      <p id="card-number" class="text-xs text-white/70 relative mb-4"></p>

      <div class="bg-white rounded-xl p-3 w-fit relative">
        <canvas id="card-qr-canvas" width="160" height="160"></canvas>
      </div>
      <p class="text-[10px] text-white/60 mt-2 relative">Présente ce code à l'accueil pour récupérer tes réservations.</p>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  let currentUser = null;
  let currentProfile = null;
  let books = [];
  let reservations = [];
  let activeCategory = null;
  let searchQuery = '';

  const CATEGORIES = [
    'Roman', 'Thriller', 'Science-fiction', 'Littérature antillaise', 'BD', 'Mangas',
    'Jeunesse', 'Développement personnel', 'Autobiographie', 'Santé', 'Histoire', 'Sport', 'Magazine', 'Autre'
  ];

  function renderCategoryFilters() {
    const el = document.getElementById('category-filters');
    const chips = [{ label: 'Tous', value: null }, ...CATEGORIES.map(c => ({ label: c, value: c }))];
    el.innerHTML = chips.map(c => `
      <button data-value="${c.value ?? ''}" class="category-chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full border transition ${
        activeCategory === c.value ? 'bg-ink text-white border-ink' : 'bg-white text-ink/60 border-mango-100 hover:border-mango-300'
      }">${c.label}</button>
    `).join('');
    el.querySelectorAll('.category-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.value || null;
        renderCategoryFilters();
        renderBooks();
      });
    });
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;

    const { data: profile } = await supabase.from('profiles').select('full_name, role, subscriber_number').eq('id', currentUser.id).single();
    currentProfile = profile;
    document.getElementById('user-name').textContent = profile?.full_name || currentUser.email;
    if (profile?.role === 'agent') {
      document.getElementById('admin-link').classList.remove('hidden');
    }

    renderCategoryFilters();
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderBooks();
    });
    await Promise.all([loadBooks(), loadReservations()]);
  }

  async function loadBooks() {
    const statusEl = document.getElementById('catalogue-status');
    const { data, error } = await supabase.from('books').select('*').order('id');
    if (error) {
      statusEl.textContent = 'Erreur de chargement : ' + error.message;
      return;
    }
    books = data;
    statusEl.textContent = '';
    renderBooks();
  }

  async function loadReservations() {
    const { data, error } = await supabase
      .from('reservations')
      .select('id, status, created_at, books ( id, title, author, cover_initial, cover_url )')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });
    if (error) {
      console.error(error);
      return;
    }
    reservations = data;
    renderReservations();
  }

  const coverCache = {};

  async function fetchCoverUrl(title, author) {
    const key = title + '|' + author;
    if (key in coverCache) return coverCache[key];
    try {
      const q = encodeURIComponent(`intitle:${title} inauthor:${author}`);
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
      const data = await res.json();
      const url = data.items?.[0]?.volumeInfo?.imageLinks?.thumbnail?.replace('http://', 'https://') || null;
      coverCache[key] = url;
      return url;
    } catch {
      coverCache[key] = null;
      return null;
    }
  }

  function handleCoverError(img, initial) {
    const div = document.createElement('div');
    div.className = 'aspect-[2/3] w-full rounded-lg bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-2xl mb-2';
    div.textContent = initial;
    img.replaceWith(div);
  }
  window.handleCoverError = handleCoverError;

  function renderBooks() {
    const list = document.getElementById('book-list');
    const reservedBookIds = new Set(reservations.filter(r => r.status !== 'recupere').map(r => r.books?.id));
    const q = searchQuery.trim().toLowerCase();
    let visibleBooks = activeCategory ? books.filter(b => b.category === activeCategory) : books;
    if (q) {
      visibleBooks = visibleBooks.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
    }

    if (visibleBooks.length === 0) {
      list.innerHTML = `<p class="col-span-full text-sm text-ink/40 text-center py-10">Aucun livre ne correspond à ta recherche.</p>`;
      return;
    }

    list.innerHTML = visibleBooks.map(b => {
      let btnHtml;
      if (!b.available) {
        btnHtml = `<button disabled class="w-full mt-2 text-[11px] font-semibold bg-ink/5 text-ink/35 rounded-lg py-1.5">Indisponible</button>`;
      } else if (reservedBookIds.has(b.id)) {
        btnHtml = `<button disabled class="w-full mt-2 text-[11px] font-semibold bg-mango-100 text-mango-700 rounded-lg py-1.5">Réservé</button>`;
      } else {
        btnHtml = `<button data-book-id="${b.id}" class="reserve-btn w-full mt-2 text-[11px] font-semibold bg-ink text-white rounded-lg py-1.5 active:scale-[0.97] transition">Réserver</button>`;
      }
      const coverHtml = b.cover_url
        ? `<img id="cover-${b.id}" src="${b.cover_url}" alt="" class="aspect-[2/3] w-full object-cover rounded-lg mb-2 bg-mango-50 shadow-sm">`
        : `<div id="cover-${b.id}" class="aspect-[2/3] w-full rounded-lg bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-2xl mb-2">${b.cover_initial || b.title[0]}</div>`;
      return `
        <div data-book-id="${b.id}" class="book-card bg-white border border-mango-100 rounded-xl p-2.5 shadow-sm flex flex-col cursor-pointer hover:shadow-md hover:border-mango-300 transition">
          ${coverHtml}
          <p class="text-[12px] font-bold text-ink leading-tight line-clamp-2">${b.title}</p>
          <p class="text-[10.5px] text-ink/50 mt-0.5">${b.author}</p>
          ${b.category ? `<span class="mt-1 inline-block w-fit text-[9.5px] font-semibold px-1.5 py-0.5 rounded bg-hibiscus-50 text-hibiscus-700">${b.category}</span>` : ''}
          <span class="mt-1.5 inline-block w-fit text-[10px] font-bold px-2 py-0.5 rounded-full ${b.available ? 'bg-mango-50 text-mango-700' : 'bg-ink/5 text-ink/40'}">
            ${b.available ? '● Disponible' : '● Emprunté'}
          </span>
          ${btnHtml}
        </div>`;
    }).join('');

    list.querySelectorAll('.reserve-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        reserveBook(Number(btn.dataset.bookId), btn);
      });
    });

    list.querySelectorAll('.book-card').forEach(card => {
      card.addEventListener('click', () => openBookModal(Number(card.dataset.bookId)));
    });

    visibleBooks.filter(b => !b.cover_url).forEach(async (b) => {
      const url = await fetchCoverUrl(b.title, b.author);
      const el = document.getElementById('cover-' + b.id);
      if (url && el) {
        const initial = (b.cover_initial || b.title[0]).replace(/'/g, "\\'");
        el.outerHTML = `<img src="${url}" alt="" class="aspect-[2/3] w-full object-cover rounded-lg mb-2 bg-mango-50" onerror="handleCoverError(this, '${initial}')">`;
      }
    });
  }

  async function reserveBook(bookId, btn) {
    btn.disabled = true;
    btn.textContent = 'Réservation…';
    const { error } = await supabase.from('reservations').insert({
      user_id: currentUser.id,
      book_id: bookId,
      status: 'preparation',
    });
    if (error) {
      alert('Erreur : ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Réserver';
      return;
    }
    await loadReservations();
    renderBooks();
  }

  const OPENING_HOURS = "Mardi-Vendredi 10h-18h · Samedi 10h-13h · Fermé dimanche et lundi";

  function formatDate(iso) {
    return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function renderReservations() {
    const list = document.getElementById('reservations-list');
    if (reservations.length === 0) {
      list.innerHTML = `<p class="text-sm text-ink/40 text-center py-10">Aucune réservation pour le moment.</p>`;
      return;
    }
    const statusMap = {
      preparation: { label: 'En préparation', classes: 'bg-amber-50 text-amber-700' },
      pret: { label: 'Prêt à récupérer', classes: 'bg-mango-50 text-mango-700' },
      recupere: { label: 'Récupéré', classes: 'bg-ink/5 text-ink/45' },
      expiree: { label: 'Expirée — remise en rayon', classes: 'bg-red-50 text-red-600' },
    };
    list.innerHTML = reservations.map(r => {
      const s = statusMap[r.status];
      const coverHtml = r.books?.cover_url
        ? `<img src="${r.books.cover_url}" alt="" class="w-11 aspect-[2/3] object-cover rounded-md shadow-sm shrink-0">`
        : `<div class="w-11 aspect-[2/3] rounded-md bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-sm shrink-0">${r.books?.cover_initial || r.books?.title?.[0] || '?'}</div>`;

      let deadlineHtml = '';
      if (r.status === 'preparation' || r.status === 'pret') {
        const deadline = new Date(new Date(r.created_at).getTime() + 48 * 3600 * 1000);
        const hoursLeft = Math.max(0, Math.round((deadline - new Date()) / 3600000));
        if (hoursLeft <= 24) {
          deadlineHtml = `
            <div class="mt-2 bg-red-50 border border-red-100 rounded-lg px-2.5 py-2">
              <p class="text-[11px] font-bold text-red-600">Il vous reste ${hoursLeft}h pour récupérer votre commande</p>
              <p class="text-[10px] text-red-500/80 mt-0.5">Horaires : ${OPENING_HOURS}</p>
            </div>`;
        } else {
          deadlineHtml = `<p class="text-[10.5px] text-ink/40 mt-1">À récupérer avant le ${formatDate(deadline.toISOString())}</p>`;
        }
      }

      return `
        <div class="bg-white border border-mango-100 rounded-xl p-3 shadow-sm">
          <div class="flex items-center gap-3">
            ${coverHtml}
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-ink">${r.books?.title || 'Livre supprimé'}</p>
              <p class="text-[11px] text-ink/50">${r.books?.author || ''}</p>
              <p class="text-[10.5px] text-ink/40 mt-0.5">Réservé le ${formatDate(r.created_at)}</p>
            </div>
            <span class="text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap ${s.classes}">${s.label}</span>
          </div>
          ${deadlineHtml}
        </div>`;
    }).join('');
  }

  window.openBookModal = async function (bookId) {
    const b = books.find(x => x.id === bookId);
    if (!b) return;

    const reserved = reservations.some(r => r.books?.id === bookId && r.status !== 'recupere');
    let btnHtml;
    if (!b.available) {
      btnHtml = `<button disabled class="w-full mt-4 text-sm font-semibold bg-ink/5 text-ink/35 rounded-lg py-2.5">Indisponible</button>`;
    } else if (reserved) {
      btnHtml = `<button disabled class="w-full mt-4 text-sm font-semibold bg-mango-100 text-mango-700 rounded-lg py-2.5">Déjà réservé</button>`;
    } else {
      btnHtml = `<button data-book-id="${b.id}" class="modal-reserve-btn w-full mt-4 text-sm font-semibold bg-ink text-white rounded-lg py-2.5 active:scale-[0.98] transition">Réserver</button>`;
    }

    const existingCover = document.getElementById('cover-' + b.id);
    const coverHtml = existingCover && existingCover.tagName === 'IMG'
      ? `<img src="${existingCover.src}" alt="" class="w-28 aspect-[2/3] object-cover rounded-lg shadow-sm shrink-0">`
      : `<div class="w-28 aspect-[2/3] rounded-lg bg-gradient-to-br from-mango-500 to-hibiscus-600 flex items-center justify-center text-white font-logo font-bold text-3xl shrink-0">${b.cover_initial || b.title[0]}</div>`;

    document.getElementById('book-modal-content').innerHTML = `
      <div class="flex gap-4">
        ${coverHtml}
        <div class="flex-1 min-w-0">
          <p class="text-base font-bold text-ink leading-snug">${b.title}</p>
          <p class="text-sm text-ink/55 mt-0.5">${b.author}</p>
          ${b.category ? `<span class="mt-2 inline-block text-[11px] font-semibold px-2 py-0.5 rounded bg-hibiscus-50 text-hibiscus-700">${b.category}</span>` : ''}
        </div>
      </div>
      ${b.summary ? `<p class="text-sm text-ink/70 leading-relaxed mt-4">${b.summary}</p>` : `<p class="text-sm text-ink/40 italic mt-4">Résumé non disponible pour ce titre.</p>`}
      ${btnHtml}
    `;

    const modalBtn = document.querySelector('.modal-reserve-btn');
    if (modalBtn) {
      modalBtn.addEventListener('click', async () => {
        await reserveBook(b.id, modalBtn);
        closeBookModal();
      });
    }

    document.getElementById('book-modal-backdrop').classList.remove('hidden');
    document.getElementById('book-modal-backdrop').classList.add('flex');
  };

  window.closeBookModal = function (event) {
    if (event && event.target.id !== 'book-modal-backdrop') return;
    document.getElementById('book-modal-backdrop').classList.add('hidden');
    document.getElementById('book-modal-backdrop').classList.remove('flex');
  };

  window.openCardModal = async function () {
    if (!currentProfile) return;
    document.getElementById('card-name').textContent = currentProfile.full_name || '';
    document.getElementById('card-number').textContent = `N° abonné ${currentProfile.subscriber_number}`;

    const { default: QRCode } = await import('https://esm.sh/qrcode@1');
    const canvas = document.getElementById('card-qr-canvas');
    await QRCode.toCanvas(canvas, currentProfile.subscriber_number, { width: 160, margin: 1, color: { dark: '#1B4B43' } });

    document.getElementById('card-modal-backdrop').classList.remove('hidden');
    document.getElementById('card-modal-backdrop').classList.add('flex');
  };

  window.closeCardModal = function (event) {
    if (event && event.target.id !== 'card-modal-backdrop') return;
    document.getElementById('card-modal-backdrop').classList.add('hidden');
    document.getElementById('card-modal-backdrop').classList.remove('flex');
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeBookModal(); closeCardModal(); }
  });

  window.logout = async function () {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  };

  init();
</script>
</body>
</html>
