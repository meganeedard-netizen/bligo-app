<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BliGO — Mes points</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], logo: ['Poppins', 'sans-serif'] },
      colors: {
        ink: '#1B4B43',
        mango: { 50:'#FFF7ED',100:'#FFEAD2',200:'#FFD4A3',300:'#FFB86B',400:'#FFA33F',500:'#FF9B2E',600:'#F07F14',700:'#C7630F',800:'#9E4E12',900:'#7C3F12' },
        hibiscus: { 50:'#FFF0F5',100:'#FFDCE9',200:'#FFB8D3',300:'#FF8FB9',400:'#F2609A',500:'#E8437A',600:'#C92C61',700:'#A3234E',800:'#7E1C3D',900:'#5F1730' }
      }
    } }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  html, body { overscroll-behavior-y: none; }
  body { min-height: 100dvh !important; }
  .font-logo { font-family: 'Poppins', sans-serif; }
</style>
</head>
<body class="bg-white text-ink min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-white shadow-sm">
  <div class="max-w-4xl mx-auto px-5 py-3.5 flex items-center gap-3">
    <a href="profil.html" class="text-ink/50 hover:text-ink shrink-0" aria-label="Retour au profil">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-base font-bold text-ink">Mes points BliGO</h1>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 py-6 max-w-sm">

  <div class="rounded-2xl p-6 text-white shadow-xl bg-gradient-to-br from-hibiscus-700 via-hibiscus-600 to-mango-600 relative overflow-hidden mb-5 text-center">
    <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10"></div>
    <div class="absolute -right-2 bottom-4 w-16 h-16 rounded-full bg-white/10"></div>
    <p class="text-xs font-semibold text-white/70 uppercase tracking-wide relative mb-1">Mes points BliGO</p>
    <p id="points-total" class="text-4xl font-extrabold relative mb-2">0</p>
    <a href="reservations.html#history-section" class="text-[11px] text-white/85 underline relative">Voir mon historique</a>
  </div>

  <p class="text-sm font-bold text-ink mb-1">Mes badges de fidélité</p>
  <p id="badges-progress-text" class="text-xs text-ink/50 mb-3"></p>
  <div id="badges-grid" class="grid grid-cols-3 gap-2.5 mb-8"></div>

  <p class="text-sm font-bold text-ink mb-3">Mes défis</p>
  <div id="defis-list" class="flex flex-col gap-2.5 mb-8"></div>

</main>

<!-- Détail d'un badge -->
<div id="badge-modal-backdrop" class="hidden fixed inset-0 z-40 bg-black/50 items-center justify-center p-5" onclick="closeBadgeModal(event)">
  <div class="bg-white rounded-2xl w-full max-w-sm relative overflow-hidden max-h-[90vh] overflow-y-auto">
    <button type="button" onclick="closeBadgeModal()" style="touch-action: manipulation;" class="absolute top-3 left-3 w-8 h-8 rounded-full bg-white/90 shadow flex items-center justify-center text-ink/60 hover:text-ink z-10" aria-label="Fermer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="pt-10 pb-6 px-6 text-center bg-gradient-to-br from-mango-50 to-hibiscus-50">
      <img id="badge-modal-img" src="" alt="" class="w-32 h-32 mx-auto mb-3">
      <p id="badge-modal-type" class="text-[11px] font-bold uppercase tracking-wide text-hibiscus-600 mb-1"></p>
      <p id="badge-modal-name" class="text-lg font-extrabold text-ink"></p>
    </div>
    <div class="p-6">
      <p id="badge-modal-message" class="text-sm text-ink/75 leading-relaxed text-center mb-5"></p>
      <button id="badge-modal-share-btn" type="button" style="touch-action: manipulation;" class="hidden w-full bg-ink text-white rounded-lg py-2.5 text-sm font-semibold active:scale-[0.98] transition">Partager ce badge</button>
      <p id="badge-modal-share-msg" class="text-xs text-center text-ink/50 mt-2"></p>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.06)]" style="transform: translateZ(0);">
  <div class="max-w-4xl mx-auto w-full flex items-center py-2 px-5">
  <a href="accueil.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5l8-7 8 7"/><path d="M6 10.3V19a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-8.7"/></svg>
    <span class="text-[9.5px] font-semibold whitespace-nowrap">Accueil</span>
  </a>
  <a href="reservations.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <span class="relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 1 1 12 0c0 3.8 1.3 5.2 1.3 5.2H4.7S6 13.3 6 9.5Z"/><path d="M10 17.7a2 2 0 0 0 4 0"/></svg>
      <span id="nav-resa-badge" class="hidden absolute -top-1 -right-1.5 min-w-[15px] h-[15px] px-1 rounded-full bg-mango-600 text-white text-[9px] font-bold flex items-center justify-center leading-none">0</span>
    </span>
    <span class="text-[9.5px] font-semibold whitespace-nowrap">Réservation</span>
  </a>
  <a href="liste-envie.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
    <span class="text-[9.5px] font-semibold whitespace-nowrap">Liste d'envie</span>
  </a>
  <a href="agenda.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-ink/40 hover:text-ink">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="text-[9.5px] font-semibold whitespace-nowrap">Agenda</span>
  </a>
  <a href="profil.html" class="flex-1 flex flex-col items-center gap-0.5 px-0.5 py-1 text-mango-700">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.6" cy="11" r="2"/><path d="M5.6 16c.4-1.7 1.7-2.6 3-2.6s2.6.9 3 2.6"/><path d="M14 9.3h5M14 12.3h5M14 15.3h3.2"/></svg>
    <span class="text-[9.5px] font-semibold whitespace-nowrap">Profil</span>
  </a>
  </div>
</nav>

<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { updateReservationBadge } from './js/navBadge.js';

  let currentUser = null;
  let currentBadges = [];

  const BADGES = [
    { id: 'badge_01', name: 'Premier Chapitre', type: 'niveau', level: 1, threshold: 30, img: 'img/badges/badge-1.png', message: "📖 Félicitations ! Tu viens de débloquer le badge Premier Chapitre. Ton aventure BliGO commence aujourd'hui !" },
    { id: 'badge_02', name: 'Petit Curieux', type: 'niveau', level: 2, threshold: 100, img: 'img/badges/badge-2.png', message: "🔍 Bravo ! Badge Petit Curieux débloqué. Ta passion pour la lecture commence à porter ses fruits dans le quartier !" },
    { id: 'badge_03', name: 'Dénicheur', type: 'niveau', level: 3, threshold: 250, img: 'img/badges/badge-3.png', message: "🎯 Bien joué ! Tu as débloqué le badge Dénicheur. Trouver les plus belles pépites de la commune, c'est ta spécialité !" },
    { id: 'badge_04', name: 'Bouquineur', type: 'niveau', level: 4, threshold: 500, img: 'img/badges/badge-4.png', message: "📚 Super ! Badge Bouquineur débloqué. Déjà 10 livres remis en circulation grâce à toi. Merci pour la communauté !" },
    { id: 'badge_05', name: 'Passeur de Mots', type: 'niveau', level: 5, threshold: 1000, img: 'img/badges/badge-5.png', message: "🤝 Impressionnant ! Tu obtiens le badge Passeur de Mots. Ta générosité fait voyager la culture de voisin en voisin !" },
    { id: 'badge_06', name: 'Dévoreur', type: 'niveau', level: 6, threshold: 2000, img: 'img/badges/badge-6.png', message: "🚀 Quel rythme ! Félicitations, tu as débloqué le badge Dévoreur. Plus rien n'arrête ta soif de lecture !" },
    { id: 'badge_07', name: 'Bibliophile', type: 'niveau', level: 7, threshold: 3500, img: 'img/badges/badge-7.png', message: "🌟 Chapeau bas ! Le badge Bibliophile est à toi. Un véritable pilier de la lecture partagée au cœur de ta commune !" },
    { id: 'badge_08', name: 'Gardien du Savoir', type: 'niveau', level: 8, threshold: 5000, img: 'img/badges/badge-8.png', message: "🏰 Incroyable ! Tu décroches le badge Gardien du Savoir. 100 livres partagés, un immense merci pour ce formidable impact local !" },
    { id: 'badge_09', name: 'Maître des Pages', type: 'niveau', level: 9, threshold: 7500, img: 'img/badges/badge-9.png', message: "👑 Légendaire ! Badge Maître des Pages débloqué. Ton engagement inspire toute la communauté BliGO !" },
    { id: 'badge_10', name: 'Légende BliGO', type: 'niveau', level: 10, threshold: 10000, img: 'img/badges/badge-10.png', message: "🏆 Sommet atteint ! Bravo, tu es officiellement une Légende BliGO. La culture de ta commune te dit un grand MERCI !" },
    { id: 'badge_sp_01', name: 'Plume Locale', type: 'special', conditionText: '150 points BliGO sur la catégorie « Plume Locale »', img: 'img/badges/badge-special-1.png', message: "🌴 Bravo péyi ! Tu as débloqué le badge Plume Locale. Merci de faire rayonner les auteurs et la culture du territoire !" },
    { id: 'badge_sp_02', name: 'Cœur Généreux', type: 'special', conditionText: '5 dons de livres validés au total', img: 'img/badges/badge-special-2.png', message: "💛 Un grand Cœur ! Tu as débloqué le badge Cœur Généreux. Grâce à tes dons, tu donnes une seconde vie aux livres !" },
  ];

  async function renderBadges(profile) {
    const xp = profile?.loyalty_points || 0;
    const tier = profile?.badge_tier || 0;

    document.getElementById('points-total').textContent = xp;

    currentBadges = BADGES.map(b => ({
      ...b,
      unlocked: b.type === 'niveau'
        ? tier >= b.level
        : (b.id === 'badge_sp_01' ? !!profile?.plume_locale_unlocked : !!profile?.coeur_genereux_unlocked),
    }));

    const next = currentBadges.find(b => b.type === 'niveau' && !b.unlocked);
    document.getElementById('badges-progress-text').textContent = next
      ? `${xp} XP — encore ${Math.max(0, next.threshold - xp)} XP pour "${next.name}"`
      : `${xp} XP — tous les paliers sont débloqués !`;

    document.getElementById('badges-grid').innerHTML = currentBadges.map(b => `
      <button type="button" onclick="openBadgeModal('${b.id}')" style="touch-action: manipulation;" class="rounded-xl p-2.5 border text-center ${b.unlocked ? 'bg-white border-white shadow-[0_1px_2px_rgba(0,0,0,0.04),0_4px_10px_rgba(0,0,0,0.07)]' : 'bg-ink/5 border-transparent'}">
        <img src="${b.img}" alt="${b.name}" class="w-14 h-14 mx-auto mb-1.5 ${b.unlocked ? '' : 'grayscale opacity-40'}">
        <p class="text-[9px] font-bold uppercase tracking-wide ${b.unlocked ? 'text-hibiscus-600' : 'text-ink/30'}">${b.type === 'niveau' ? 'Niveau ' + b.level : 'Spécial'}</p>
        <p class="text-[10px] font-semibold leading-tight ${b.unlocked ? 'text-hibiscus-800' : 'text-ink/35'}">${b.name}</p>
      </button>
    `).join('');
  }

  window.openBadgeModal = function (badgeId) {
    const b = currentBadges.find(x => x.id === badgeId);
    if (!b) return;

    document.getElementById('badge-modal-img').src = b.img;
    document.getElementById('badge-modal-img').className = `w-32 h-32 mx-auto mb-3 ${b.unlocked ? '' : 'grayscale opacity-40'}`;
    document.getElementById('badge-modal-type').textContent = b.type === 'niveau' ? `Niveau ${b.level}` : 'Badge spécial';
    document.getElementById('badge-modal-name').textContent = b.name;

    const shareBtn = document.getElementById('badge-modal-share-btn');
    document.getElementById('badge-modal-share-msg').textContent = '';

    if (b.unlocked) {
      document.getElementById('badge-modal-message').textContent = b.message;
      shareBtn.classList.remove('hidden');
      shareBtn.onclick = () => shareBadge(b);
    } else {
      document.getElementById('badge-modal-message').textContent = `Débloque ce badge : ${b.conditionText || (b.threshold + ' points BliGO')}.`;
      shareBtn.classList.add('hidden');
    }

    const backdrop = document.getElementById('badge-modal-backdrop');
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
  };

  window.closeBadgeModal = function (event) {
    if (event && event.target.id !== 'badge-modal-backdrop') return;
    const backdrop = document.getElementById('badge-modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
  };

  async function shareBadge(b) {
    const shareText = `J'ai débloqué le badge « ${b.name} » sur BliGO ! ${b.message}`;
    const msg = document.getElementById('badge-modal-share-msg');
    msg.textContent = '';

    // On essaie d'abord de partager l'image du badge elle-même (pas juste le
    // texte) — nécessite de la récupérer en fichier avant de la proposer au
    // partage natif du téléphone.
    let file = null;
    try {
      const response = await fetch(b.img);
      const blob = await response.blob();
      file = new File([blob], `badge-${b.id}.png`, { type: blob.type || 'image/png' });
    } catch (e) {
      file = null;
    }

    const canShareFile = file && navigator.canShare && navigator.canShare({ files: [file] });

    if (canShareFile || navigator.share) {
      try {
        await navigator.share(canShareFile
          ? { files: [file], title: 'BliGO', text: shareText }
          : { title: 'BliGO', text: shareText });
      } catch (e) {
        // Partage annulé par l'usager — rien à faire.
      }
      return;
    }

    try {
      await navigator.clipboard.writeText(shareText);
      msg.textContent = 'Texte copié ! Colle-le où tu veux.';
    } catch (e) {
      msg.textContent = shareText;
    }
  }

  const DEFIS = [
    { code: 'vide_bibliotheque', name: 'Vide-Bibliothèque', description: '3 dons déposés dans l\'année', reward: 100 },
    { code: 'critique_litteraire', name: 'Critique Littéraire', description: '3 avis déposés sur des livres', reward: 50 },
    { code: 'marathon_10_livres', name: 'Marathon 10 Livres', description: '10 livres marqués comme lus', reward: 100 },
    { code: 'evenement_culturel', name: 'Événement Culturel', description: 'Présent à 5 événements culturels', reward: 80 },
  ];

  async function renderDefis(userId) {
    const [{ data: completed }, { count: donations1y }, { count: reviewsCount }, { count: readCount }, { data: rsvpEvents }] = await Promise.all([
      supabase.from('defis_completed').select('defi_code').eq('user_id', userId),
      supabase.from('free_books').select('id', { count: 'exact', head: true }).eq('donated_by', userId).gte('created_at', new Date(Date.now() - 365 * 24 * 60 * 60 * 1000).toISOString()),
      supabase.from('book_reviews').select('id', { count: 'exact', head: true }).eq('user_id', userId),
      supabase.from('reservations').select('id', { count: 'exact', head: true }).eq('user_id', userId).eq('status', 'recupere'),
      // Pas de vrai pointage de présence à l'entrée d'un événement : une
      // inscription à un événement dont la date est passée fait office de
      // "présence" (voir sql/add_evenement_culturel_defi.sql).
      supabase.from('event_rsvps').select('events ( event_date )').eq('user_id', userId),
    ]);

    const eventsAttendedCount = (rsvpEvents || []).filter(r => r.events?.event_date && new Date(r.events.event_date) < new Date()).length;

    const completedCodes = new Set((completed || []).map(d => d.defi_code));
    const progressByCode = {
      vide_bibliotheque: donations1y || 0,
      critique_litteraire: reviewsCount || 0,
      marathon_10_livres: readCount || 0,
      evenement_culturel: eventsAttendedCount,
    };
    const goalByCode = { vide_bibliotheque: 3, critique_litteraire: 3, marathon_10_livres: 10, evenement_culturel: 5 };

    document.getElementById('defis-list').innerHTML = DEFIS.map(d => {
      const done = completedCodes.has(d.code);
      const progress = Math.min(progressByCode[d.code], goalByCode[d.code]);
      const pct = Math.round((progress / goalByCode[d.code]) * 100);
      return `
        <div class="bg-white rounded-xl p-3.5 shadow-sm">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <p class="text-sm font-bold text-ink">${d.name}</p>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${done ? 'bg-mango-50 text-mango-700' : 'bg-ink/5 text-ink/45'}">${done ? '✓ Réussi' : `+${d.reward} XP`}</span>
          </div>
          <p class="text-[11px] text-ink/50 mb-2">${d.description}</p>
          <div class="w-full bg-ink/5 rounded-full h-1.5 overflow-hidden">
            <div class="h-1.5 rounded-full ${done ? 'bg-mango-500' : 'bg-hibiscus-500'}" style="width:${done ? 100 : pct}%"></div>
          </div>
          <p class="text-[10.5px] text-ink/40 mt-1">${progress} / ${goalByCode[d.code]}</p>
        </div>`;
    }).join('');
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;
    updateReservationBadge(currentUser.id);

    const { data: profile } = await supabase
      .from('profiles')
      .select('loyalty_points, badge_tier, plume_locale_unlocked, coeur_genereux_unlocked')
      .eq('id', currentUser.id).single();

    await renderBadges(profile);
    await renderDefis(currentUser.id);
  }

  init();
</script>
</body>
</html>
